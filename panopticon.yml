# panopticon.yml -- reviewed and committed like any other linter config.
# groups: match/tests/panels/exclude, gitignore-flavored globs; first
# matching group wins. A group whose keys are names (no match:) is a
# parent; its subgroups are its layers and roll up to it in the report.
# settings: max_per_group / max_groups / max_verify (positive ints).
#
# 2026-09-06: re-proposed from scratch by the 5.2 grouping engine
# (`driver setup .`, setup-scan on Opus; spine 72 code / 31 commons /
# 126 test-tree files, cap 48). Four verticals replaced the 12 hand-crafted
# 5.1 groups (the superseded matrix was parked locally, untracked). Hand
# edits on top of the draft:
#   - `AI` renamed `Orchestration` (catalog name fit literally, read badly
#     in reports); OPS added to its floor -- 5.1 `Platform` (_version,
#     write_guard_hook) carried OPS and those files now live here.
#   - ToolAdapters (63 files > cap) given an `Integration` layer over the
#     adapter modules instead of mechanical chunking; residual is `Core`.
#   - `CI` committed over all of .github/** -- the shipped Commons CI
#     category misses top-level `.github/*.yml` / `.github/*.sh`, and a
#     committed group named CI suppresses that category, so it takes the
#     whole tree. Its four tests exercise .github files. Retire this
#     group once #1508 lands in the shipped catalog.
#   - `exclude_paths` re-added by hand: setup drafts drop it (#1504).
#   - 2026-09-15 (#1638 P06, run-13): the matrix had stopped growing with the
#     tree -- 23 runtime files (the host boundary, the `runners/` and `probes/`
#     packages, orchestrate/progress/findings_contract, skill/workflows) and 49
#     test files were reviewed in `Ungrouped_1`, without their architecture
#     context and, worse, without a test inventory: `phases/review.py` builds
#     that inventory from the claiming group's `tests:` axis, so a reviewer was
#     told the Codex scope broker had no automated coverage (P13). Fourth
#     `Orchestration` layer `Hosts` added over the host boundary, and every
#     stray test file given the group whose code it exercises.
#     `tests/test_matrix_coverage.py` now fails the suite when a file is left
#     unclaimed -- which is how eighteen of them accumulated unnoticed.
#     THE MATRIX IS COMMITTED: the guard, `driver readiness` and every
#     contributor's PR diff all need it in the checkout, and
#     skill/docs/PANOPTICON.md tells every target repo to commit it. Back
#     then it lived under `.panopticon/` and was force-added past
#     `.gitignore`'s `.panopticon*/`, which exists for run ARTIFACTS.
#   - 2026-09-18 (#1681 Plan 1): the matrix moved out of `.panopticon/` to
#     this root file, where nothing ignores it and it is committed by
#     construction. Nothing reads the old path any more; `driver
#     migrate-config` is the one-way remedy for a tree that still has it.
#   - 2026-09-18 (#1718): `Orchestration:Hosts` had reached the 48-file cap,
#     so `runners/outage.py`, `probes/kimi_snapshot.py` and two runner tests
#     were parked under `Core`. Fifth `Orchestration` layer `Runners` added
#     over the launch seam (`runners/**`, `kimi_toml.py`, `tests/runners/**`);
#     `Hosts` keeps the registry, posture, guards, probes and workflows.
#   - 2026-09-21 (#1670): synthesis already has `Reporting:Synth` and the
#     host launch seam has `Orchestration:Runners`. Split report rendering
#     and issue export into `Reporting:Outputs` to leave room in `Core`;
#     move verdict-bundle-schema.json beside its sibling contracts there.
#
# Fixtures: deliberately-vulnerable hostile test corpora. Redteam mode keeps
# fixtures in review scope by design (discovery.py include_fixtures=redteam),
# but for THIS self-scan they are pure noise -- they are SUPPOSED to be
# vulnerable. `exclude_paths:` (top-level, #1136) prunes them BEFORE grouping,
# so no review cell of any domain sees them -- SEC included, which a per-group
# `exclude:` can never silence (#1084).
version: 1
groups:
  ToolAdapters:
    Integration:
      match:
      - skill/scripts/tools/**
      tests:
      - tests/tools/**
      - tests/test_integration_strictness.py
      - tests/test_no_unguarded_parse_index.py
      panels:
      - ARC
      - SEC
    Core:
      match:
      - skill/scripts/run_tools.py
      - skill/scripts/ingest_tools.py
      - skill/scripts/_run_adapter.py
      - skill/scripts/smoke_adapters.py
      - skill/scripts/run_fixture_tests.py
      - skill/scripts/capture_goldens.py
      - skill/scripts/security_gate.py
      - scripts/bump_pins.py
      # #1734: the tools image's committed closures, claimed beside the script
      # that maintains their digests and the tests that guard them. The older
      # Docker inputs (Dockerfile, Dockerfile.fixtures, requirements-fixtures.txt)
      # are still unclaimed and reviewed as Ungrouped -- one decision, not this
      # issue's, and `tests/test_matrix_coverage.py` does not cover this surface.
      - requirements-tools.txt
      - tools-image/**
      tests:
      - tests/run_tools_test_helpers.py
      - tests/test_run_tools_core.py
      - tests/test_run_tools_adapter.py
