# Panopticon Commons catalog -- near-universal, cross-cutting file groups
# (Docs/CI/Build/Config/Deps) that discovery.catalog_groups checks AFTER the
# committed .panopticon/groups.yml catalog: committed groups always win,
# Commons only ever sees genuine leftovers, and the true residual still
# chunks `Ungrouped_N`.
#
# 5.2 (#1499): the 5.1 starter's 38 hand-picked globs are replaced by the
# EMPIRICAL pass the starter's header promised -- globs proposed by >=4 of 6
# independent seats in the 5.2.0 vocab panel (calibration/2026-08-21-5.2.0-
# vocab-panel/), unioned with all 38 shipped globs, then curated to 182.
#
# The panel reproduced the starter's five categories exactly and proposed no
# sixth, which is the load-bearing result: the taxonomy is convergent, only
# its coverage was thin.
#
# UNION, not replace. Seven shipped globs (.gitlab-ci.yml, Jenkinsfile,
# azure-pipelines*, *.mk, *.ini, *.cfg, build.gradle*) were absent from the
# panel set because the calibration pool is GitHub-hosted -- pool bias, not
# evidence against them. Dropping them would have been a silent regression.
#
# Curation rules applied to the raw 234-glob union:
#   R1  drop directory-prefix globs that commonly hold application source
#       (`config/**` -> Rails routes/initializers are code). Such files fall
#       to Ungrouped, whose yield is a catalog-COVERAGE signal we surface.
#   R2  drop single-repo artifacts that cleared the >=4-seat filter by chance.
#   R3  drop a literal when a sibling wildcard in the same category already
#       claims it under discovery.match_patterns (44 collapsed). Verified
#       with the real matcher, not fnmatch: a no-slash pattern matches the
#       BASENAME at any depth, so `*.md` really does subsume
#       `.github/CONTRIBUTING.md`.
#   R4  a glob proposed for two categories goes to Build when it drives the
#       toolchain (tsconfig*.json, rust-toolchain.toml).
# Regression check: every one of the 38 shipped globs is still claimed.
#
# Category ORDER IS SEMANTIC -- assign_by_catalog is first-match-wins.
#
# Loaded by discovery._commons_catalog() as a plain {name: {"match": [...]}}
# mapping fed straight to assign_by_catalog -- NOT routed through
# groups_schema.parse_groups (this is shipped/tested data, not committed
# user input).
#
# Sizing: discovery folds Commons categories under COMMONS_MIN_FILES into a
# single `Commons` group. Measured across 6 target-runs / 319 group-instances,
# a tiny (<=5 file) universal group yields 0.20 findings/cell and is empty 86%
# of the time, versus 2.99 for a normal-sized one. Widening these globs without
# that floor would manufacture more of exactly that waste.
groups:
  Docs:
    match:
    - "*.md"
    - "*.rst"
    - ".github/*.md"
    - ".github/ISSUE_TEMPLATE/**"
    - "AUTHORS"
    - "CHANGELOG*"
    - "CITATION.cff"
    - "CONTRIBUTING*"
    - "COPYING"
    - "INSTALL"
    - "LICENSE*"
    - "LICENSES/**"
    - "NOTICE*"
    - "README*"
    - "SECURITY*"
    - "changelog/**"
    - "doc/**"
    - "docs/**"
    - "man/**"
  CI:
    match:
    - ".buildkite/**"
    - ".ci/**"
    - ".circleci/**"
    - ".github/actions/**"
    - ".github/dependabot.yml"
    - ".github/scripts/**"
    - ".github/workflows/**"
    - ".gitlab-ci.yml"
    - ".travis.yml"
    - ".woodpecker/**"
    - "Jenkinsfile"
    - "azure-pipelines*"
    - "codecov.yml"
    - "codemagic.yaml"
  Build:
