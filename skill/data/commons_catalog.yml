    - "build.gradle*"
    - "build.rs"
    - "cmake/**"
    - "compose.yml"
    - "composer.json"
    - "config.ru"
    - "docker-compose*.yml"
    - "docker/**"
    - "flake.nix"
    - "go.mod"
    - "gradle.properties"
    - "gradle/**"
    - "gradlew"
    - "gradlew.bat"
    - "jest.preset.js"
    - "lerna.json"
    - "mvnw"
    - "mvnw.cmd"
    - "nx.json"
