# Panopticon capability vocabulary -- R2 roster (5.2 grouping engine, spec §3.2).
#
# R1 (2026-08-16, calibration/2026-08-15-vocab-panel-r1/rulings.md): the 13
# entries marked `provenance: r1` are kept VERBATIM (definition/boundary/hints/
# evidence untouched); they gained `aliases` and `examples` only.
# R2 (2026-08-21-5.2.0-vocab-panel, 6 seats x up to 165 repos, 714 vertical-
# sweep cells): 32 entries marked `provenance: panel-5.2.0`, harvested by
# panopticon-docs/calibration/scripts/harvest_capability_roster.py -- a folded
# name canonical in >= 10 repos is an entry; 5..9 is an alias or `deferred`.
#
# Loader-consumed keys (setup_proposal.load_vocabulary): `name`, `hints`
# (optional, non-authoritative globs), `aliases` (folded by alias_key: casefold,
# non-alphanumerics stripped -- "Identity & Access" == identityaccess).
# `definition`/`boundary` are rendered into the setup-scan brief (#1500);
# `examples` are verified pool anchors ({repo, path} under calibration_targets);
# `tier`/`see_also`/`provenance`/`evidence` are audit metadata.
# Hint overlap between an R1 entry and a newer one (e.g. Notifications
# `**/email*/**` vs Email) is expected: hints suggest, definitions decide.
version: 2.0.0
capabilities:
  - name: Auth
    tier: universal
    definition: "Credential, session, and identity-verification lifecycle (login, MFA, token/session issuance)."
    boundary: "Profile, preference, and org-membership CRUD is Accounts, not Auth."
    hints: ["**/auth/**", "**/login/**", "**/session*/**"]
    aliases: [Authentication, Identity, IdentityAccess, "Identity & Access", IAM, UsersAuth, AuthIdentity, Login, SSO, OAuth]
    examples:
      - {repo: infisical, path: backend/src/services/auth}
      - {repo: documenso, path: packages/auth/}
      - {repo: authelia, path: internal/authentication}
    see_also: [Accounts]
    provenance: r1
    evidence: {round: 2026-08-15-vocab-panel-r1, repos_present: 92, repos_total: 96}

  - name: Accounts
    tier: universal
    definition: "User profile, preference, and organization-membership management (account CRUD)."
    boundary: "Credential, session, and identity lifecycle is Auth, not Accounts."
    hints: ["**/account*/**", "**/users/**", "**/profile*/**"]
    aliases: [Users, User, Account, UserManagement, AccountManagement, Profiles]
    examples:
      - {repo: bookstack, path: app/Users/}
      - {repo: freescout, path: app/Http/Controllers/UsersController.php}
      - {repo: gotify, path: ui/src/user}
