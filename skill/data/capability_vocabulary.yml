    evidence: {round: 2026-08-21-5.2.0-vocab-panel, repos_present: 17, seats: 6}

  - name: Documents
    tier: vertical
    definition: "Document-centric product objects: documents/notes/pages as first-class records, revisions, templates, signing."
    boundary: "The rich-text editing component is Editor; generic file blobs are Storage; marketing/CMS pages are Content."
