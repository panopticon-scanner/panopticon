  - name: Email
    tier: universal
    definition: "Email as a subsystem: templates, mailers, SMTP/provider transport, inbound mail parsing, deliverability."
    boundary: "Deciding WHAT to tell the user across channels is Notifications (R1); Email is the channel implementation."
    hints: ["**/email/**", "**/emails/**", "**/mail/**", "**/mailers/**"]
    aliases: [Mail, Mailers, SMTP, Emails]
    examples:
