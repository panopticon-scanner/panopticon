hosts:
  kimi:
    scout:
      model: primary
      alias: kimi-for-coding
      max_context_size: 131072
      max_output_size: 16384
    advisor:
      model: secondary
      alias: k3
      max_context_size: 524288
      max_output_size: 32768
    domain_panel:
      model: secondary
      alias: k3
      max_context_size: 131072
      max_output_size: 16384
    domain_advisor:
      model: secondary
      alias: k3
      max_context_size: 524288
      max_output_size: 32768
