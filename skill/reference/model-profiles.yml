hosts:
  # models-verified: 2026-11-11 https://www.kimi.com/code/docs/en/kimi-code/models
  kimi:
    scout:
      model: primary
      alias: k3-256k
      # The alias names its 256k ceiling; scout keeps a bounded 131072-token role budget.
      max_context_size: 131072
      max_output_size: 16384
    advisor:
      model: secondary
      alias: k3.1-pro
      max_context_size: 524288
      max_output_size: 32768
    domain_panel:
      model: secondary
      alias: k3.1-pro
      max_context_size: 131072
      max_output_size: 16384
    domain_advisor:
      model: secondary
      alias: k3.1-pro
      max_context_size: 524288
      max_output_size: 32768
    # R-F4-2 (#1737): `driver setup`'s one-off classifier inherits the
    # session's model. An explicit null, so the parity test sees a decision.
    setup_scan:
      model: null
  # models-verified: 2026-11-11 https://platform.claude.com/docs/en/models/overview https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions
  claude:
    scout:
      model: claude-haiku-5-5
    advisor:
      model: claude-haiku-5-5
    domain_panel:
      model: claude-sonnet-5-5
    domain_advisor:
      model: claude-opus-5-5
    setup_scan:
      model: null
  # models-verified: 2026-11-11 https://developers.openai.com/api/docs/models
  codex:
    scout:
      model: gpt-6-luna
      model_reasoning_effort: medium
    advisor:
      model: gpt-6.1-sol
      model_reasoning_effort: high
    domain_panel:
      model: gpt-6.1-sol
      model_reasoning_effort: high
    domain_advisor:
      model: gpt-6.1-sol
      model_reasoning_effort: high
    setup_scan:
      model: null
  # Carbon is available in Antigravity, but this runner carries only a model
  # field and cannot bind Antigravity's separate effort input.
  # models-verified: 2026-11-11 https://antigravity.google/docs/models https://antigravity.google/docs/enterprise
  agy:
    scout:
      model: gemini-3.8-flash-medium
      tier: flash
    advisor:
      model: gemini-3.8-flash-medium
      tier: flash
    domain_panel:
      model: gemini-4-argon-high
      tier: pro
    domain_advisor:
      model: gemini-4-argon-high
      tier: pro
    setup_scan:
      model: null
  # `gemini-4-carbon` is the flagship reasoning model (`domain_panel`,
  # `domain_advisor`); `gemini-3.8-flash` is the stable Flash model (`scout`,
  # `advisor`).
  # models-verified: 2026-11-11 https://aistudio.google.com/docs/models/gemini-4-carbon https://ai.google.dev/gemini-api/docs/models/gemini-3.8-flash https://ai.google.dev/gemini-api/docs/deprecations
  gemini:
    scout:
      model: gemini-3.8-flash
    advisor:
      model: gemini-3.8-flash
    domain_panel:
      model: gemini-4-carbon
    domain_advisor:
      model: gemini-4-carbon
    setup_scan:
      model: null
  openrouter:
    scout:
      model: openai/gpt-4o-mini
      max_context_size: 128000
      max_output_size: 4096
    advisor:
      model: anthropic/claude-opus
      max_context_size: 200000
      max_output_size: 16384
    domain_panel:
      model: anthropic/claude-sonnet
      max_context_size: 200000
      max_output_size: 8192
    domain_advisor:
      model: anthropic/claude-opus
      max_context_size: 200000
      max_output_size: 16384
    setup_scan:
      model: null
