      model: gpt-5.6-luna
      model_reasoning_effort: medium
    advisor:
      model: gpt-5.6-sol
      model_reasoning_effort: high
    domain_panel:
      model: gpt-5.6-terra
      model_reasoning_effort: high
    domain_advisor:
