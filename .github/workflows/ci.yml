name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# #1784 (ARC-3955973987): stated here, not inherited. The three install
# exemptions `tests/test_workflow_pins.py` grants this file are justified by its
# read-only token, and until this block that token was the repository's
# `GITHUB_TOKEN` default -- a setting outside this tree that no PR can review and
# a repository-settings change can widen. `contents: read` is the whole need: the
# jobs below check out, lint, type-check and run the matrix, and publish nothing.
# `actions/upload-artifact` uploads within its own run, which the Actions runtime
# token covers -- `docker-publish.yml`'s build job uploads under `contents: read`
# too, and only reading ANOTHER run's artifact needs a scope (security.yml's
# `actions: read`).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check skill/scripts/ tests/
      - name: Type check
        run: python -m mypy skill/scripts scripts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # stopgap for the slow 3.11 leg (cancelled at 60); restore when the suite is sharded (#2933)
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      # #2933 follow-up: the suite runs in two passes so it is safe under xdist.
      # Everything that is not a timing/performance test runs in parallel; the
      # `serial`-marked time-bound tests then run on their own, because parallel
      # workers inflate even `time.process_time()` on large inputs (CPU/memory/
      # cache contention) and red-fail tight bounds like `assert_linear_growth`.
      # The parallel pass writes coverage data with no report and no gate; the
      # serial pass appends to it and the COMBINED total is what `--cov-fail-under`
      # judges and what `coverage.xml` carries for the upload step.
      - name: Test (parallel, not serial)
        run: python -m pytest tests/ -q -n auto -m "not serial" --cov --cov-report=
      - name: Test (serial timing/performance)
        run: python -m pytest tests/ -q -m "serial" --cov --cov-append --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
