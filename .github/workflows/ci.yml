name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# #1784 (ARC-3955973987): stated here, not inherited. The three install
# exemptions `tests/test_workflow_pins.py` grants this file are justified by its
# read-only token, and until this block that token was the repository's
# `GITHUB_TOKEN` default -- a setting outside this tree that no PR can review and
# a repository-settings change can widen. `contents: read` is the whole need: the
# jobs below check out, lint, type-check and run the matrix, and publish nothing.
# `actions/upload-artifact` uploads within its own run, which the Actions runtime
# token covers -- `docker-publish.yml`'s build job uploads under `contents: read`
# too, and only reading ANOTHER run's artifact needs a scope (security.yml's
# `actions: read`).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check privileged requirements wheel hashes
        run: python3 scripts/bump_pins.py requirements --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check skill/scripts/ tests/
      - name: Type check
        run: python -m mypy skill/scripts scripts

  # #2933, the rough shard. One job per Python version used to run both passes,
  # and the 3.11 leg took 18 to 56 minutes depending on runner contention and
  # was cancelled at the job limit more than once. Now:
  #   test-cov     3.12 only, UNSHARDED, both passes: the one coverage gate
  #                (coverage is interpreter-independent here -- no
  #                sys.version_info branches, no version-conditional skips) and
  #                the one complete `.test_durations` profile per run.
  #   test         3.11/3.13/3.14 x 2 groups, the parallel pass only, split by
  #                the committed `.test_durations` (pytest-split, least_duration)
  #                so each group carries half the measured time; no coverage.
  #   test-serial  3.11/3.13/3.14, the `serial`-marked timing tests alone on a
  #                fresh runner, so their wall-clock bounds are not read after a
  #                long parallel pass has heated the box; no coverage.
  #   tests-passed one always-reporting gate over the three -- the single
  #                required check, so reshaping the matrix again never touches
  #                branch protection.
  # Why two passes at all: `serial`-marked time-bound tests red-fail under xdist
  # because parallel workers inflate even `time.process_time()` on large inputs
  # (CPU/memory/cache contention) against tight bounds like `assert_linear_growth`.
  test-cov:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # tighten once the shard timings settle (#2933)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      # The parallel pass writes coverage data with no report and no gate; the
      # serial pass appends to it and the COMBINED total is what `--cov-fail-under`
      # judges and what `coverage.xml` carries. The parallel pass also records the
      # complete per-test duration profile the sharded legs balance against.
      - name: Test (parallel, not serial)
        run: python -m pytest tests/ -q -n auto -m "not serial" --cov --cov-report= --store-durations --durations-path .test_durations
      - name: Test (serial timing/performance)
        run: python -m pytest tests/ -q -m "serial" --cov --cov-append --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: warn
      - name: Upload test durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-python-3.12
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # tighten once the shard timings settle (#2933)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
        group: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      # The committed `.test_durations` (a full 3.11 profile) drives the split; a
      # test it does not know gets the average duration, so a new test lands in
      # a group rather than failing the split.
      - name: Test (parallel, not serial, group ${{ matrix.group }} of 2)
        run: python -m pytest tests/ -q -n auto -m "not serial" --splits 2 --group ${{ matrix.group }} --splitting-algorithm least_duration --durations-path .test_durations

  test-serial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test (serial timing/performance)
        run: python -m pytest tests/ -q -m "serial"

  tests-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-cov, test, test-serial]
    if: always()
    env:
      COV: ${{ needs.test-cov.result }}
      SHARDS: ${{ needs.test.result }}
      SERIAL: ${{ needs.test-serial.result }}
    steps:
      - name: Every test job succeeded
        run: |
          echo "test-cov=$COV test=$SHARDS test-serial=$SERIAL"
          test "$COV" = success && test "$SHARDS" = success && test "$SERIAL" = success
