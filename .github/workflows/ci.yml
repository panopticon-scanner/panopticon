name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# #1784 (ARC-3955973987): stated here, not inherited. The three install
# exemptions `tests/test_workflow_pins.py` grants this file are justified by its
# read-only token, and until this block that token was the repository's
# `GITHUB_TOKEN` default -- a setting outside this tree that no PR can review and
# a repository-settings change can widen. `contents: read` is the whole need: the
# jobs below check out, lint, type-check and run the matrix, and publish nothing.
# `actions/upload-artifact` uploads within its own run, which the Actions runtime
# token covers -- `docker-publish.yml`'s build job uploads under `contents: read`
# too, and only reading ANOTHER run's artifact needs a scope (security.yml's
# `actions: read`).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check skill/scripts/ tests/
      - name: Type check
        run: python -m mypy skill/scripts scripts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # until the suite is sharded (#2933)
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: python -m pytest tests/ -q --cov --cov-fail-under=90 --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
