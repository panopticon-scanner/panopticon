name: Security Scan

on:
  push:
    branches: [main]
  # Fork PRs (untrusted) run under pull_request_target so the BASE workflow
  # judges them and the PR patch can never rewrite the gate that judges it.
  pull_request_target:
    branches: [main]
  # Same-repo branch PRs (trusted: write-access + required review) run under
  # pull_request. Both triggers are present so the required `scan` check always
  # reports; the job-level `if` below routes each PR to exactly ONE of them
  # (fork -> target, same-repo -> pull_request), so there is never a double run.
  # Regardless of trigger the gate LOGIC always executes from the base-SHA
  # `controller` checkout below and the PR head is only ever mounted as
  # read-only scan data, so the scanner code is tamper-proof on every path.
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}-tools:latest
jobs:
  scan:
    runs-on: ubuntu-latest
    # Route each PR to exactly one trigger: forks via pull_request_target,
    # same-repo branches via pull_request; push always runs.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name != github.repository) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      # Controller = the scanner code that runs the gate. Fork PRs
      # (pull_request_target) pin it to the BASE SHA so untrusted code can never
      # execute as the controller. Same-repo PRs (pull_request) pin it to the
      # HEAD SHA so a branch's own scanner changes are tested by their own CI
      # (the trusted-contributor self-test), matching the trigger routing above.
      # push uses the pushed SHA. The target is always mounted read-only below.
      - name: Checkout trusted scanner controller
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.base.sha) || github.event.pull_request.head.sha || github.sha }}
          path: controller
          persist-credentials: false

      # The target is untrusted data and is only mounted read-only into scanners.
      - name: Checkout scan target
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build panopticon-tools image
        run: |
          if docker pull ${{ env.IMAGE }}; then
            docker tag ${{ env.IMAGE }} panopticon-tools
          else
            echo "Pre-built image not found; building from trusted controller checkout."
            docker build -t panopticon-tools controller
          fi

      - name: Run static-analysis tools
        run: |
          tools_out="$RUNNER_TEMP/panopticon-tools-output"
          manifest="$RUNNER_TEMP/panopticon-tools-manifest.json"
          mkdir -p "$tools_out"
          python controller/skill/scripts/run_tools.py \
            --target target \
            --out "$tools_out" \
            --manifest "$manifest" \
            --deps

      # INTENTIONAL POLICY, not an oversight (#513): this CI gate fails on any
      # HIGH/CRITICAL *tool* finding on raw severity, WITHOUT the two-axis
      # evidence gate the rest of the system uses. That gate promotes a finding
      # only on an advisor CONFIRMED verdict (evidence.status tool_confirmed /
      # advisor_confirmed; see skill/scripts/evidence.py GATE_ELIGIBLE_DEFAULT
      # and DEVELOPMENT.md). CI runs NO advisor phase — every tool finding here
      # is unverified `tool_reported`, so confirmed-only gating would gate on
      # nothing and the CI security gate would never fire. So CI deliberately
      # adopts the strict `--gate-unverified` posture: unverified tool findings
      # block a merge, accepting the false-positive risk (mitigated by the
      # F-CAL-2 fixture exclusion below) in exchange for a hard pre-merge floor.
      # The advisor/evidence pipeline is the authority for the *reported* grade;
      # this is a conservative merge guard, not that grade.
      - name: Gate on HIGH/CRITICAL tool findings (unverified-strict policy)
        run: |
          python controller/skill/scripts/security_gate.py \
            --tools-dir "$RUNNER_TEMP/panopticon-tools-output" \
            --manifest "$RUNNER_TEMP/panopticon-tools-manifest.json" \
            --exclude 'tests/fixtures/*'

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/panopticon-tools-output
