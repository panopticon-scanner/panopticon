name: Security Scan

on:
  # TRUSTED routes: main pushes, same-repo PRs, and main-only full scans.
  # Same-repo branch PRs carry write access + required review. This file has NO
  # `pull_request_target`; fork PRs are scanned by `security-fork.yml`, behind
  # a maintainer's `safe-to-scan` label, and report under the name `fork-scan`.
  #
  # Why the split is load-bearing (#1900): a job skipped by an `if:` still
  # posts a check run under its own name, and GitHub reports a skipped job as
  # Success. Any second trigger that could reach this file and skip `scan`
  # would therefore be a way to post a green `scan` NEWER than a real failure
  # -- on same-repo PRs as much as on fork ones. Full events therefore use
  # a conditional job NAME, including when a non-main dispatch skips.
  #
  # A fork PR does reach the `pull_request` route, where this job's same-repo
  # test is false and it skips: nothing is scanned, and no scanner ever sees
  # fork-controlled source from here. Note also that GitHub runs the PR's OWN
  # copy of this file on that route (with a read-only token and no secrets),
  # so nothing written here binds a fork PR at all. What binds one is required
  # review, the repository's "require approval for all outside collaborators"
  # setting -- which, unlike `pull_request_target`, DOES cover this route --
  # and the required `fork-scan` check from `security-fork.yml`.
  push:
    branches: [main]
  # No `types:`: the defaults (opened, synchronize, reopened) are what keep a
  # new head from inheriting the previous head's verdict.
  pull_request:
    branches: [main]

  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}-tools:latest
  TOOLS_OUT: panopticon-tools-output
  # #1740 fix round 2: `**`, because `--exclude` now reads the same
  # gitignore-flavored vocabulary discovery reads `exclude_paths:` with, where
  # `*` stops at `/`. Spelling it `*` would have silently narrowed this gate's
  # exclusion to the direct children of tests/fixtures/ and started gating on
  # the deliberately-vulnerable corpus below it.
  FIXTURE_GLOB: tests/fixtures/**
  # #1578 fix round 2: captured raw SCANNER OUTPUT, not code this
  # repository authors -- `tests/goldens/tool-raw/*.raw` is one authentic,
  # trimmed payload per adapter, so a secret a scanner once reported is
  # quoted there verbatim and gitleaks finds it again on every run. Same
  # class as the fixture corpus above, and the one class that cannot be
  # composed away: every other in-tree literal was removed at its source
  # (tests/_test_helpers.py) rather than excluded, because an allowlist
  # hides the real ones too. Mirrored onto BOTH steps, like FIXTURE_GLOB:
  # an exclusion on one half makes the scan and the gate disagree about
  # what was reviewed. Scoped to the captures themselves, not the whole
  # directory: a blind spot should be exactly as wide as its argument.
  GOLDEN_GLOB: tests/goldens/tool-raw/**
jobs:
  scan:
    name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'strict-full-tree' || 'scan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # push always runs; a PR runs only from a SAME-REPO head. A fork PR skips
    # here by design -- see the trigger comment -- and is scanned by
    # security-fork.yml instead. Full events run only on main and carry their
    # own check name even when skipped.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: read
      security-events: write
      # #1790: reading the BASE commit's own `raw-scanner-captures` artifact
      # from its `security.yml` run, which is what makes this gate delta-aware.
      # Read-only, and the narrowest scope that can download another run's
      # artifact.
      actions: read
    steps:
      # Controller = the scanner code that runs the gate, and on both of this
      # file's routes it is TRUSTED code: the pushed SHA, or a same-repo
      # branch's own HEAD, so a branch's scanner changes are tested by their
      # own CI (the trusted-contributor self-test). The fork case -- where the
      # controller must be pinned to the BASE sha instead -- lives in
      # security-fork.yml, unconditionally. The target is mounted read-only.
      - name: Checkout trusted scanner controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: controller
          persist-credentials: false

      # #1790 fix round 1 (review C1): EVERY route fetches a baseline, and no
      # route is inert. The first cut fetched one on the PR routes only and
      # left the push to main strict, which defeated itself in four moves:
      # `#1790`'s promotion makes main's own gate fail on 24 findings; this
      # workflow has ONE job, so the run's conclusion is `failure`; the next
      # PR's lookup asks for a SUCCESSFUL run at its base commit and finds
      # none; and that PR is then gated strictly on all 24, which its author
      # cannot clear from their own diff -- so main never goes green and every
      # later PR inherits the same state.
      #
      # `--status completed`, NOT `--status success` (review N1). The success
      # filter was there to stop a partial baseline -- a run that failed on
      # lost coverage -- from excusing head findings. That is now exactly what
      # the gate itself refuses: `load_baseline` runs `lost_required_coverage`
      # on the baseline's own manifest and dispositions and rejects a partial
      # or unparseable one LOUDLY and STRICTLY. The filter was belt over a
      # working brace, and the belt had a failure mode of its own: an
      # ABSORBING STATE. A HIGH the owner dismisses on the Security tab rather
      # than removing from tool output reds main's own run; each following
      # commit reaches the last green one a hop further back; at the sixth it
      # is past `MAX_HOPS`, and from then on nothing -- no PR, no push -- can
      # find a baseline. That is the C1 deadlock again, with no way out. Six
      # runs lost to a registry outage, or a 90-day artifact expiry on a slow
      # repo, reach it with no finding involved at all. A red run's capture is
      # uploaded (`if: always()` below) and is now selectable.
      #
      # The WALK still earns its keep, for the cases no status filter can
      # help with: an artifact that has expired, and a cancelled run that has
      # none. From the base commit, up to five first-parent ancestors. Walking
      # further back only makes the gate stricter -- an older baseline means
      # more findings read as new -- never looser.
      #
      # What main gets in exchange for no longer being gated on its own
      # standing set: that set is DISCLOSED under the pre-existing heading on
      # every single run, and it is governed by the post-merge code-scanning
      # audit (`scripts/code_scanning_audit.py`) and the owner's own GitHub
      # dismissals, which is where a finding is fixed or ruled on.
      #
      # `actions: read` on this job is for exactly this step and nothing else:
      # reading another run's artifacts is the only thing it grants.
      #
      # It sits HERE, between the two checkouts, on BOTH routes: it is the only
      # step in either job that exports `GH_TOKEN`, so it runs before any
      # scanned content is on disk -- fork-controlled on one route, a PR
      # branch's own on the other. The base it reads is a main commit either
      # way (`pull_request_target` is `branches: [main]`, and a push route
      # reads main's previous head), so nothing a fork controls chooses which
      # baseline is fetched.
      - name: Download the base commit's scanner captures
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` resolves the repository from the checkout's git remote, and
          # the workspace root is not one (both checkouts are in subdirectories),
          # so it is named explicitly rather than inferred.
          GH_REPO: ${{ github.repository }}
          # Push to main: the PREVIOUS main head. Pull request (either
          # trigger): the PR's base -- never its own head, which would carry
          # the PR's own findings and excuse every one of them. Any other event
          # resolves to the empty string, which the script reads as "no base"
          # and runs strict. Through `env:`, like every other event value
          # either file reads.
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          # NO `continue-on-error` and NO `timeout-minutes` (review M3, fix
          # round 2). This step must not be able to red a required check
          # because GitHub's API was slow -- but buying that by softening the
          # step means carving an exception into a ban this repository keeps
          # ABSOLUTE, since `continue-on-error: true` is the one-line edit that
          # turns the gate's own refusal into a pass. The property is bought
          # here instead, where it costs no rule:
          #
          #   * every `gh` call carries its own coreutils `timeout`, so a hung
          #     API returns 124 rather than hanging until the JOB's ceiling;
          #   * every one of them sits in an `if`/`&&` position, where `set -e`
          #     does not fire, so a non-zero status advances the walk or ends
          #     it and never ends the step;
          #   * `DEADLINE` bounds the WHOLE walk, which the per-call caps do
          #     not: six list calls, six failed downloads and five parent
          #     lookups at those caps is 1740s against a job ceiling of 1800 --
          #     inside it by a minute, which is not a bound. The budget is
          #     tested at the TOP of the loop, so an iteration may START inside
          #     it: the worst case is the budget plus ONE WHOLE ITERATION's
          #     caps (60 + 180 + 60), i.e. 600s, not the budget plus one call's
          #     (review N4). `TestTheDeltaBaselineIsFetchedOnEveryRoute`
          #     asserts that arithmetic over these very numbers, so inflating
          #     any of them fails there rather than here.
          #
          # A slow, broken or absent `gh` therefore costs the DELTA -- no
          # `found=true` is written, the gate reads the empty string and runs
          # strict on the whole tree -- and can never cost the check.
          #
          # `rm -rf` before EVERY attempt (review N3): each hop downloads into
          # the same directory, and a download that fails after extracting part
          # of its archive would leave those files for a later hop to extract
          # over -- a baseline spliced from two commits, which the gate's
          # lost-coverage probe cannot see because the surviving manifest is
          # the later run's. The `[ -n "${RUNNER_TEMP:-}" ]` guard is there
          # because this is the one command here where an empty value is
          # destructive rather than merely useless -- and it is a guard,
          # not a `:?` expansion, so an empty value fails this hop and the
          # run degrades to strict instead of aborting the step.
          #
          # The all-zero sha is what a branch creation or a force push reports
          # as `before`; protected main cannot produce either, which is exactly
          # why the guard is written down.
          set -euo pipefail
          MAX_HOPS=5
          DEADLINE=300
          ZERO_SHA=0000000000000000000000000000000000000000
          found=false
          sha="$BASE_SHA"
          hops=0
          while [ -n "$sha" ] && [ "$sha" != "$ZERO_SHA" ] \
                && [ "$SECONDS" -lt "$DEADLINE" ]; do
            if run_id="$(timeout 60 gh run list --workflow security.yml \
                  --commit "$sha" --status completed --json databaseId --limit 1 \
                  --jq '.[0].databaseId // empty')" \
               && [ -n "$run_id" ] \
               && [ -n "${RUNNER_TEMP:-}" ] && rm -rf "$RUNNER_TEMP/baseline" \
               && timeout 180 gh run download "$run_id" \
                    -n raw-scanner-captures -D "$RUNNER_TEMP/baseline"; then
              found=true
              echo "::notice::Baseline: security.yml run $run_id at commit $sha, $hops hop(s) back from $BASE_SHA."
              break
            elif [ "$hops" -ge "$MAX_HOPS" ]; then
              break
            else
              hops=$((hops + 1))
              if ! sha="$(timeout 60 gh api "repos/$GH_REPO/commits/$sha" \
                    --jq '.parents[0].sha // empty')"; then
                sha=""
              fi
            fi
          done
          if [ "$found" != true ]; then
            echo "::notice::No completed security.yml run carrying raw-scanner-captures within $MAX_HOPS first-parent hop(s) back from ${BASE_SHA:-(this event has no base commit)}; this run is gated strictly, on every HIGH/CRITICAL finding in the tree rather than only the ones it adds."
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      # Read-only history is fetched before any scan target is on disk. The
      # helper has no third-party imports on this path; deps are installed later.
      - name: Download previous scheduled main snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 controller/.github/scripts/security-backstop.py retrieve \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/strict-history.json"

      # The target is untrusted data and is only mounted read-only into scanners.
      - name: Checkout scan target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          # #run9 SEC-E2A pinned the gate's OWN deps by version; #run13 (#1641)
          # found that the line ABOVE that pin upgraded pip itself from an
          # unconstrained artifact, so the unpinned tool installed the pinned
          # things. This workflow logs
          # into GHCR, pulls/builds the tools image, and gates merges with
          # security-events: write -- what it installs is an execution
          # primitive, so it is pinned by DIGEST, pip included.
          #
          # The file comes from `controller/`, the trusted checkout, never from
          # `target/`: a PR that could edit the digests the gate installs by
          # would be editing the gate.
          #
          # --require-hashes: pip refuses any artifact whose sha256 is not in
          # that file. --no-deps: the file is the complete closure rather than a
          # resolver seed, so nothing unpinned can arrive as a dependency. The
          # runner's own pip performs this one install and is replaced by it.
          python -m pip install --require-hashes --no-deps \
            -r controller/.github/requirements-gate.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build panopticon-tools image
        # #1575 (OPS-A1A): TWO bounds, and both are load-bearing. `timeout 600`
        # is the one that matters -- the fallback below is selected by EXIT
        # STATUS, so a STALLED (as opposed to refused or 404) GHCR response left
        # `docker pull` hanging, the `else` was never reached, and the
        # deliberately-engineered degraded-local-build path was dead in exactly
        # the scenario it exists for. `timeout-minutes` is the backstop for the
        # step as a whole (the build in the else branch has no deadline of its
        # own). The job's own `timeout-minutes: 30` is neither: it converts a
        # fast handled degradation into a hard failure of a required check
        # thirty minutes later. Same adjudication as docker-build-pr.yml:23-32
        # (#run10 OPS-A1A), whose fix was likewise a per-call deadline.
        timeout-minutes: 10
        run: |
          if timeout 600 docker pull ${{ env.IMAGE }}; then
            docker tag ${{ env.IMAGE }} panopticon-tools
          else
            echo "::warning::Pre-built panopticon-tools image not available from GHCR; falling back to a local build. The security scan will run on a degraded, secretless image (NVD API key and some offline assets may be missing)."
            echo "Pre-built image not found; building from trusted controller checkout."
            docker build -t panopticon-tools controller
          fi

      - name: Record actual scanner image identity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          docker image inspect panopticon-tools --format '{{.Id}}' > "$RUNNER_TEMP/strict-image-id.txt"

      # --progress (#1317): this step can sit inside a single `docker run` for
      # many minutes. Without it the Actions log shows nothing between the
      # image pull and the gate, so a working scan and a hung one look
      # identical from the run page. Safe HERE and not from the driver: nothing
      # reads this process's stderr as a diagnostic, whereas phases/tools.py
      # builds its failure note from the first 300 characters of it.
      # Both security workflows scan in `redteam` (owner ruling 2026-09-26,
      # #1839). Today the mode changes two things: under `redteam` the
      # name-only virtualenv skip hands the scanners nothing (run_tools.py,
      # `_venv_excludes`) and the gate re-admits name-suppressed findings
      # (security_gate.py, policy C), so a PR cannot park a HIGH under a
      # `venv/`-named directory. #1839's PR 5 adds the rest: under `standard`
      # a target's own `.bandit`, `# nosec`, `# nosemgrep` and
      # `gitleaks:allow` are honoured, under `redteam` none of them is.
      # `standard` is an operator scanning their own repository;
      # `security-fork.yml` scans a fork-authored tree on a required check,
      # so both routes run `redteam`. This route follows because the captures
      # this push uploads are the baseline the next PR's gate diffs against,
      # and that diff is only meaningful within one mode -- nothing records
      # the mode, so a cross-mode pair is undetectable; the first run after
      # this change is that pair (measured: zero new HIGH on this tree). The
      # mode is one attached pair on every scanner run, gate call and
      # backstop snapshot below, pinned per step by
      # `tests/test_security_fork_workflow.py`.
      - name: Run static-analysis tools
        run: |
          tools_out="$RUNNER_TEMP/${{ env.TOOLS_OUT }}"
          manifest="$RUNNER_TEMP/panopticon-tools-manifest.json"
          mkdir -p "$tools_out"
          python controller/skill/scripts/run_tools.py \
            --target target \
            --out "$tools_out" \
            --manifest "$manifest" \
            --exclude '${{ env.FIXTURE_GLOB }}' \
            --exclude '${{ env.GOLDEN_GLOB }}' \
            --security redteam \
            --progress \
            --deps

      # INTENTIONAL POLICY, not an oversight (#513): this CI gate fails on any
      # HIGH/CRITICAL *tool* finding on raw severity, WITHOUT the two-axis
      # evidence gate the rest of the system uses. That gate promotes a finding
      # only on an advisor CONFIRMED verdict (evidence.status tool_confirmed /
      # advisor_confirmed; see skill/scripts/evidence.py GATE_ELIGIBLE_DEFAULT
      # and DEVELOPMENT.md). CI runs NO advisor phase — every tool finding here
      # is unverified `tool_reported`, so confirmed-only gating would gate on
      # nothing and the CI security gate would never fire. So CI deliberately
      # adopts the strict `--gate-unverified` posture: unverified tool findings
      # block a merge, accepting the false-positive risk (mitigated by the
      # F-CAL-2 fixture exclusion below) in exchange for a hard pre-merge floor.
      # The advisor/evidence pipeline is the authority for the *reported* grade;
      # this is a conservative merge guard, not that grade.
      - name: Gate on HIGH/CRITICAL tool findings (unverified-strict policy)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASELINE_FOUND: ${{ steps.baseline.outputs.found }}
        run: |
          # #1790: the baseline flags are passed ONLY when the step above
          # actually downloaded one. A skipped step's output is the empty
          # string, so the push-to-main route -- and a PR whose base has no
          # capture -- runs strict through the same single command, with no
          # second copy of it to drift from this one.
          set -euo pipefail
          baseline=()
          if [ "$BASELINE_FOUND" = "true" ]; then
            baseline=(--baseline-dir "$RUNNER_TEMP/baseline/panopticon-tools-output"
                      --baseline-manifest "$RUNNER_TEMP/baseline/panopticon-tools-manifest.json")
          fi
          # `${baseline[@]+"${baseline[@]}"}` and not `"${baseline[@]}"`: under
          # `set -u` an EMPTY array expansion is an unbound-variable error on
          # bash before 4.4, which would fail this step -- and so the required
          # check -- on the strict route, the one that has to work everywhere.
          # The long form expands to no words at all when the array is empty
          # and to properly quoted words when it is not.
          python controller/skill/scripts/security_gate.py \
            --tools-dir "$RUNNER_TEMP/${{ env.TOOLS_OUT }}" \
            --manifest "$RUNNER_TEMP/panopticon-tools-manifest.json" \
            --exclude '${{ env.FIXTURE_GLOB }}' \
            --exclude '${{ env.GOLDEN_GLOB }}' \
            --security redteam \
            ${baseline[@]+"${baseline[@]}"}

      - name: Strict full-tree gate
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python controller/skill/scripts/security_gate.py \
            --tools-dir "$RUNNER_TEMP/${{ env.TOOLS_OUT }}" \
            --manifest "$RUNNER_TEMP/panopticon-tools-manifest.json" \
            --exclude '${{ env.FIXTURE_GLOB }}' \
            --exclude '${{ env.GOLDEN_GLOB }}' \
            --security redteam

      - name: Publish strict security snapshot and summary
        id: strict-report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          python controller/.github/scripts/security-backstop.py report \
            --tools-dir "$RUNNER_TEMP/${{ env.TOOLS_OUT }}" \
            --manifest "$RUNNER_TEMP/panopticon-tools-manifest.json" \
            --commit "$GITHUB_SHA" \
            --image-file "$RUNNER_TEMP/strict-image-id.txt" \
            --history "$RUNNER_TEMP/strict-history.json" \
            --output "$RUNNER_TEMP/snapshot.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --exclude '${{ env.FIXTURE_GLOB }}' \
            --exclude '${{ env.GOLDEN_GLOB }}' \
            --security redteam

      - name: Upload strict security snapshot
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.strict-report.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-security-snapshot
          path: ${{ runner.temp }}/snapshot.json
          if-no-files-found: error

      # Reporting runs after the gate under `always()`: a red vulnerability
      # gate must not hide either the raw evidence or the current Security
      # analysis. The helper publishes its two output directories atomically,
      # so a parse/validation failure cannot look like a successful empty scan.
      - name: Prepare Security and AI inventory reports
        id: prepare-reports
        if: always()
        run: |
          # The Security upload carries the gate's scope, plus the test tree:
          # bandit reads `tests/` since #2117 (the target's `.bandit` is no
          # longer honoured), and its test-suite idioms (`/tmp` literals,
          # subprocess stubs, fake tokens) are not alerts an operator acts on.
          # The gate itself still sees `tests/` -- a HIGH there still fails a
          # PR -- and the excluded count is printed and in the step summary.
          python controller/scripts/code_scanning_reports.py \
            --input-dir "$RUNNER_TEMP/${{ env.TOOLS_OUT }}" \
            --output-dir "$RUNNER_TEMP/code-scanning-reports" \
            --exclude '${{ env.FIXTURE_GLOB }}' \
            --exclude '${{ env.GOLDEN_GLOB }}' \
            --exclude 'tests/**'

      - name: Upload raw scanner captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-scanner-captures
          path: |
            ${{ runner.temp }}/${{ env.TOOLS_OUT }}
            ${{ runner.temp }}/panopticon-tools-manifest.json
          if-no-files-found: error

      - name: Upload AI inventory
        if: always() && steps.prepare-reports.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-usage-inventory
          path: ${{ runner.temp }}/code-scanning-reports/inventory
          if-no-files-found: error

      - name: Publish AI inventory summary
        if: always() && steps.prepare-reports.outcome == 'success'
        run: |
          cat "$RUNNER_TEMP/code-scanning-reports/inventory/ai-inventory.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload actionable SARIF to GitHub Security tab
        id: upload-sarif
        if: always() && steps.prepare-reports.outcome == 'success'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ runner.temp }}/code-scanning-reports/security

      # The pinned upload action can warn and continue while processing is
      # still pending, so action success is not the completeness proof. This
      # read-only audit binds that upload plus CodeQL's separate upload to the
      # exact, still-current main SHA before asking GitHub for every open alert.
      - name: Audit current main for open code-scanning alerts
        if: >-
          always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.upload-sarif.outcome == 'success'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_SARIF_ID: ${{ steps.upload-sarif.outputs.sarif-id }}
        run: |
          python controller/scripts/code_scanning_audit.py \
            --repository "$GITHUB_REPOSITORY" \
            --server-url "$GITHUB_SERVER_URL" \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --sarif-id "$SECURITY_SARIF_ID"
