name: Security Scan

on:
  push:
    branches: [main]
  # Fork PRs (untrusted) run under pull_request_target so the BASE workflow
  # judges them and the PR patch can never rewrite the gate that judges it.
  # #1900 -- and a fork PR is scanned ONLY after a maintainer opts it in, by
  # applying the `safe-to-scan` label. GitHub's "require approval for outside
  # collaborators" setting does not cover pull_request_target, so without this
  # anyone who could open a PR could run the scanners over a tree of their own
  # choosing, in a job holding this repository's token. The whole fork posture,
  # in one place:
  #   * scanned only on the `labeled` event with `safe-to-scan` -- so the scan
  #     runs over the head the maintainer was looking at, not a later one;
  #   * the label is REVOKED by the `unlabel` job on every new push and every
  #     reopen, so the next head waits for a maintainer again;
  #   * no GHCR login, so no credential is written to the runner;
  #   * no `--deps`, so the dependency scanner that reads the target's own
  #     lockfiles never runs there (fewer tools, by design);
  #   * no SARIF upload, because under pull_request_target `github.ref` is the
  #     BASE branch and the findings would be filed against main.
  # The full tool set, with the upload, runs on the push to main after merge.
  pull_request_target:
    branches: [main]
    # `opened` is deliberately NOT here. The default type set starts a scan the
    # moment a fork PR appears; `labeled` is what admits one, and
    # `synchronize`/`reopened` exist so the `unlabel` job can revoke it again.
    types: [synchronize, reopened, labeled]
  # Same-repo branch PRs (trusted: write-access + required review) run under
  # pull_request. Both triggers are present so the required `scan` check always
  # reports; the job-level `if` below routes each PR to exactly ONE of them
  # (fork -> target, same-repo -> pull_request), so there is never a double run.
  # Regardless of trigger the gate LOGIC always executes from the base-SHA
  # `controller` checkout below and the PR head is only ever mounted as
  # read-only scan data, so the scanner code is tamper-proof on every path.
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}-tools:latest
  TOOLS_OUT: panopticon-tools-output
  # #1740 fix round 2: `**`, because `--exclude` now reads the same
  # gitignore-flavored vocabulary discovery reads `exclude_paths:` with, where
  # `*` stops at `/`. Spelling it `*` would have silently narrowed this gate's
  # exclusion to the direct children of tests/fixtures/ and started gating on
  # the deliberately-vulnerable corpus below it.
  FIXTURE_GLOB: tests/fixtures/**
jobs:
  # #1900: the maintainer approved a HEAD, not a pull request. A `safe-to-scan`
  # label that outlived a force-push would be the hole the gate exists to close
  # -- approve a benign diff, push the payload. So every new head
  # (`synchronize`) and every reopen revokes the label and the PR waits for a
  # maintainer again. This is the ONLY job here that holds a write grant on a
  # fork-triggered event, so it holds exactly one scope, checks nothing out,
  # and interpolates no event data into shell (everything through `env:`).
  unlabel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      (github.event.action == 'synchronize' ||
       github.event.action == 'reopened')
    permissions:
      pull-requests: write
    steps:
      - name: Revoke safe-to-scan on the new head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Most pushes land on a fork PR that was never labelled, and GitHub
          # answers a DELETE of an absent label with 404: that is "already
          # revoked", not a failure, and failing on it would paint every such
          # PR red. Any OTHER failure DOES fail the job -- a silently-failed
          # revoke leaves a maintainer's approval standing on a head nobody
          # reviewed, which is the one outcome this job exists to prevent.
          err="$RUNNER_TEMP/unlabel.err"
          if gh api --method DELETE \
               "repos/$REPO/issues/$PR_NUMBER/labels/safe-to-scan" \
               >/dev/null 2>"$err"; then
            echo "safe-to-scan revoked; this head needs a maintainer again."
          elif grep -q "HTTP 404" "$err"; then
            echo "safe-to-scan was not set; nothing to revoke."
          else
            cat "$err" >&2
            exit 1
          fi

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Route each PR to exactly one trigger: forks via pull_request_target,
    # same-repo branches via pull_request; push always runs. The fork arm
    # carries the #1900 gate: the event must be the `labeled` one AND the label
    # must be `safe-to-scan`, so a fork PR that nobody has opted in produces no
    # run of this job at all (its required check stays "expected" until a
    # maintainer applies the label). Same-repo PRs and push are unchanged.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name != github.repository &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'safe-to-scan') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      # Controller = the scanner code that runs the gate. Fork PRs
      # (pull_request_target) pin it to the BASE SHA so untrusted code can never
      # execute as the controller. Same-repo PRs (pull_request) pin it to the
      # HEAD SHA so a branch's own scanner changes are tested by their own CI
      # (the trusted-contributor self-test), matching the trigger routing above.
      # push uses the pushed SHA. The target is always mounted read-only below.
      - name: Checkout trusted scanner controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.base.sha) || github.event.pull_request.head.sha || github.sha }}
          path: controller
          persist-credentials: false

      # The target is untrusted data and is only mounted read-only into scanners.
      - name: Checkout scan target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          # #run9 SEC-E2A pinned the gate's OWN deps by version; #run13 (#1641)
          # found that the line ABOVE that pin upgraded pip itself from an
          # unconstrained artifact, so the unpinned tool installed the pinned
          # things. This workflow logs
          # into GHCR, pulls/builds the tools image, and gates merges under
          # pull_request_target with security-events: write -- what it installs
          # is an execution primitive, so it is pinned by DIGEST, pip included.
          #
          # The file comes from `controller/`, the trusted checkout (the base
          # SHA on a fork PR), never from `target/`: a PR that could edit the
          # digests the gate installs by would be editing the gate.
          #
          # --require-hashes: pip refuses any artifact whose sha256 is not in
          # that file. --no-deps: the file is the complete closure rather than a
          # resolver seed, so nothing unpinned can arrive as a dependency. The
          # runner's own pip performs this one install and is replaced by it.
          python -m pip install --require-hashes --no-deps \
            -r controller/.github/requirements-gate.txt

      - name: Log in to GitHub Container Registry
        # #1900: never on the fork path. The tools image is public and pulls
        # anonymously, and the step below falls back to a local build if the
        # pull fails at all -- so a login here would write GITHUB_TOKEN into
        # the runner's docker config, where a scanner turned against the
        # runner could read it, in exchange for nothing.
        if: github.event_name != 'pull_request_target'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build panopticon-tools image
        # #1575 (OPS-A1A): TWO bounds, and both are load-bearing. `timeout 600`
        # is the one that matters -- the fallback below is selected by EXIT
        # STATUS, so a STALLED (as opposed to refused or 404) GHCR response left
        # `docker pull` hanging, the `else` was never reached, and the
        # deliberately-engineered degraded-local-build path was dead in exactly
        # the scenario it exists for. `timeout-minutes` is the backstop for the
        # step as a whole (the build in the else branch has no deadline of its
        # own). The job's own `timeout-minutes: 30` is neither: it converts a
        # fast handled degradation into a hard failure of a required check
        # thirty minutes later. Same adjudication as docker-build-pr.yml:23-32
        # (#run10 OPS-A1A), whose fix was likewise a per-call deadline.
        timeout-minutes: 10
        run: |
          if timeout 600 docker pull ${{ env.IMAGE }}; then
            docker tag ${{ env.IMAGE }} panopticon-tools
          else
            echo "::warning::Pre-built panopticon-tools image not available from GHCR; falling back to a local build. The security scan will run on a degraded, secretless image (NVD API key and some offline assets may be missing)."
            echo "Pre-built image not found; building from trusted controller checkout."
            docker build -t panopticon-tools controller
          fi

      # --progress (#1317): this step can sit inside a single `docker run` for
      # many minutes. Without it the Actions log shows nothing between the
      # image pull and the gate, so a working scan and a hung one look
      # identical from the run page. Safe HERE and not from the driver: nothing
      # reads this process's stderr as a diagnostic, whereas phases/tools.py
      # builds its failure note from the first 300 characters of it.
      - name: Run static-analysis tools
        env:
          # #1900: the dependency flag, off the fork path only. The `&&`/`||`
          # ternary yields '--deps' when the left side is true and '' (an
          # empty string, which the unquoted expansion below drops entirely)
          # when it is not.
          DEPS_FLAG: ${{ github.event_name != 'pull_request_target' && '--deps' || '' }}
        run: |
          # A fork PR is scanned with FEWER tools, by design. The flag adds the
          # dependency scanner (`select_tools`, run_tools.py:406-415), which is
          # the one that reads the target's own lockfiles and manifests -- the
          # surface #1742/#1877 live on. Nothing online is selected on either
          # path (`--online` is never passed, so `filter_online` drops the
          # online-only adapters, run_tools.py:495-505/1269), so
          # `egress.session` yields an inactive session (tools/egress.py:323-326)
          # and every container runs `--network none`. The full tool set runs
          # on the push to main after the merge.
          tools_out="$RUNNER_TEMP/${{ env.TOOLS_OUT }}"
          manifest="$RUNNER_TEMP/panopticon-tools-manifest.json"
          mkdir -p "$tools_out"
          python controller/skill/scripts/run_tools.py \
            --target target \
            --out "$tools_out" \
            --manifest "$manifest" \
            --exclude '${{ env.FIXTURE_GLOB }}' \
            --progress \
            $DEPS_FLAG

      # INTENTIONAL POLICY, not an oversight (#513): this CI gate fails on any
      # HIGH/CRITICAL *tool* finding on raw severity, WITHOUT the two-axis
      # evidence gate the rest of the system uses. That gate promotes a finding
      # only on an advisor CONFIRMED verdict (evidence.status tool_confirmed /
      # advisor_confirmed; see skill/scripts/evidence.py GATE_ELIGIBLE_DEFAULT
      # and DEVELOPMENT.md). CI runs NO advisor phase — every tool finding here
      # is unverified `tool_reported`, so confirmed-only gating would gate on
      # nothing and the CI security gate would never fire. So CI deliberately
      # adopts the strict `--gate-unverified` posture: unverified tool findings
      # block a merge, accepting the false-positive risk (mitigated by the
      # F-CAL-2 fixture exclusion below) in exchange for a hard pre-merge floor.
      # The advisor/evidence pipeline is the authority for the *reported* grade;
      # this is a conservative merge guard, not that grade.
      - name: Gate on HIGH/CRITICAL tool findings (unverified-strict policy)
        run: |
          python controller/skill/scripts/security_gate.py \
            --tools-dir "$RUNNER_TEMP/${{ env.TOOLS_OUT }}" \
            --manifest "$RUNNER_TEMP/panopticon-tools-manifest.json" \
            --exclude '${{ env.FIXTURE_GLOB }}'

      - name: Upload SARIF to GitHub Security tab
        # #1900: never on the fork path. Under pull_request_target the run's
        # `github.ref` is the BASE branch, so a fork-controlled SARIF would be
        # filed against main's Security tab. ACCEPTED RESIDUAL: the job's
        # `security-events: write` cannot be narrowed per path within one job,
        # so the grant is still present on the fork path -- the label gate is
        # what bounds who can reach it, and no step on that path uses it.
        if: always() && github.event_name != 'pull_request_target'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ runner.temp }}/${{ env.TOOLS_OUT }}
