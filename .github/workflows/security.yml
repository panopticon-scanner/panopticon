name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TOOLS_OUT: .panopticon/tools
  IMAGE: ghcr.io/${{ github.repository }}-tools:latest
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build panopticon-tools image
        run: |
          if docker pull ${{ env.IMAGE }}; then
            docker tag ${{ env.IMAGE }} panopticon-tools
          else
            echo "Pre-built image not found; building locally."
            docker build -t panopticon-tools .
          fi

      - name: Run static-analysis tools
        run: |
          mkdir -p ${{ env.TOOLS_OUT }}
          python scripts/run_tools.py --target . --out ${{ env.TOOLS_OUT }} --deps

      - name: Ingest findings and gate on HIGH/CRITICAL
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, os.path.join(os.getcwd(), 'scripts'))
          import ingest_tools as it
          findings = it.ingest_dir(os.environ['TOOLS_OUT'], 'ci')
          # Ignore intentionally vulnerable test fixtures.
          def _is_fixture(f):
              path = (f.get('location') or {}).get('file', '')
              return 'tests/fixtures/' in path
          findings = [f for f in findings if not _is_fixture(f)]
          high = [f for f in findings if f.get('severity') in ('HIGH', 'CRITICAL')]
          print(f"Ingested {len(findings)} non-fixture tool findings; {len(high)} HIGH/CRITICAL")
          if high:
              for f in high[:20]:
                  loc = f.get('location', {})
                  print(f"  {f.get('severity')} {f.get('id')} {loc.get('file')}:{loc.get('line_start')} - {f.get('title')}")
              sys.exit(1)
          PY

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.TOOLS_OUT }}
