name: pin freshness

# Dependabot covers this repo's pip and github-actions dependencies. It does NOT
# cover the artifacts the Dockerfile fetches by curl and verifies by SHA256, so
# those drift by hand.
#
# rustup made the cost concrete on 2026-09-01: the fetch used the MOVING
# `rustup/dist/` URL, so a new upstream release broke `sha256sum -c` and with it
# every from-scratch build, on PRs that touched nothing related (#1467). Pinning
# to the immutable archive URL fixed the breakage and INVERTED the failure mode:
# the build is now stable indefinitely, so drift became silent. A pin that cannot
# break is a pin nobody remembers to bump.
#
# Hence a schedule, not a gate. Nothing here is urgent; the job is visibility.
on:
  schedule:
    - cron: "15 7 * * 1"      # Mondays, after the nightly image work settles
  workflow_dispatch:

permissions:
  contents: read

# One job per pin family (`bump_pins.py <family>`). The requirements family
# (#1641) is deliberately NOT on this schedule: its VERSIONS are Dependabot's to
# bump, and its digests only move when a version does, so a weekly rewrite would
# be a no-op PR every Monday. The operator refreshes it beside the version bump
# -- DEVELOPMENT.md, "Regenerating the pinned dependency hashes".
jobs:
  tinyproxy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Inherits contents:read. A changed digest is a warning for manual review.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the egress sidecar digest
        run: python3 scripts/bump_pins.py tinyproxy

  rustup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # scoped to this job: it commits a branch
      pull-requests: write     # ...and opens the PR
    steps:
      # Pinned to the same SHA every sibling workflow uses (ARC-F2A,
      # #1517): this job holds contents:write + pull-requests:write and
      # pushes branches, so a moved upstream tag would run here with the
      # widest token in the fleet. Dependabot bumps the pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the pin
        id: check
        run: |
          python3 scripts/bump_pins.py rustup | tee /tmp/pins.txt
          if grep -q "available (re-run with --write)" /tmp/pins.txt; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # bump_pins refuses to write a checksum it has not verified against the
      # downloaded artifact, so a failure here means "do not pin", not "retry".
      - name: Apply the bump
        if: steps.check.outputs.stale == 'true'
        run: python3 scripts/bump_pins.py rustup --write

      - name: Open a PR
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ARG RUSTUP_VERSION=//p' Dockerfile)"
          BRANCH="chore/bump-rustup-${VERSION}"
          # Idempotent: if last week's PR is still open, leave it alone rather
          # than opening a second one for the same version.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "branch $BRANCH already exists; nothing to open"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Dockerfile
          git commit -m "chore(docker): bump rustup pin to ${VERSION}" \
            -m "Opened by the pin-freshness workflow. Both SHA256 values were read from upstream's own .sha256 file AND verified against the downloaded artifact before being written -- bump_pins.py refuses to pin an unverified checksum." \
            -m "Review is still required: this asserts the digests are authentic, not that the new rustup is one we want."
          git push -u origin "$BRANCH"
          gh pr create --fill --label dependencies

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Trivy pin
        id: check
        run: |
          set -euo pipefail
          python3 scripts/bump_pins.py trivy | tee /tmp/trivy-pins.txt
          if grep -q "available (re-run with --write)" /tmp/trivy-pins.txt; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply the verified Trivy bump
        if: steps.check.outputs.stale == 'true'
        run: |
          set -euo pipefail
          python3 scripts/bump_pins.py trivy --write
      - name: Open a Trivy PR
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ARG TRIVY_VERSION=//p' Dockerfile)"
          BRANCH="chore/bump-trivy-${VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "branch $BRANCH already exists; nothing to open"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Dockerfile
          git commit -m "chore(deps): bump Trivy pin to ${VERSION}" \
            -m "Generated by the GitHub Actions pin-freshness workflow. Both SHA256 values came from the official Trivy release checksums file and matched the downloaded AMD64 and ARM64 archives before the Dockerfile was written. Review the release and image build before merging."
          git push -u origin "$BRANCH"
          gh pr create --fill --label dependencies

  rust-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Rust toolchain pin
        id: check
        run: |
          set -euo pipefail
          python3 scripts/bump_pins.py rust-toolchain | tee /tmp/rust-toolchain-pins.txt
          if grep -q "available (re-run with --write)" /tmp/rust-toolchain-pins.txt; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply the verified Rust toolchain bump
        if: steps.check.outputs.stale == 'true'
        run: |
          set -euo pipefail
          python3 scripts/bump_pins.py rust-toolchain --write
      - name: Open a Rust toolchain PR
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ARG RUST_TOOLCHAIN_VERSION=//p' Dockerfile)"
          BRANCH="chore/bump-rust-toolchain-${VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "branch $BRANCH already exists; nothing to open"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Dockerfile
          git commit -m "chore(deps): bump Rust toolchain pin to ${VERSION}" \
            -m "Generated by the GitHub Actions pin-freshness workflow. The version came from Rust's stable channel manifest after its companion SHA256 matched the downloaded manifest, and both image Linux GNU targets were marked available. Review the compiler release and image build before merging."
          git push -u origin "$BRANCH"
          gh pr create --fill --label dependencies
