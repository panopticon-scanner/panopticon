name: pin freshness

# Dependabot covers this repo's pip and github-actions dependencies. It does NOT
# cover the artifacts the Dockerfile fetches by curl and verifies by SHA256, so
# those drift by hand.
#
# rustup made the cost concrete on 2026-09-01: the fetch used the MOVING
# `rustup/dist/` URL, so a new upstream release broke `sha256sum -c` and with it
# every from-scratch build, on PRs that touched nothing related (#1467). Pinning
# to the immutable archive URL fixed the breakage and INVERTED the failure mode:
# the build is now stable indefinitely, so drift became silent. A pin that cannot
# break is a pin nobody remembers to bump.
#
# Hence a schedule, not a gate. Nothing here is urgent; the job is visibility.
#
# #3420: each job verifies its family with bump_pins' own checks and keeps one
# open issue (`pin-freshness: <family> <pinned> -> <latest>`) via
# devtools/report_pin_bump.py. It opens no PR and pushes no branch: letting
# Actions create PRs would also let workflows approve them, so that repository
# setting stays off. A bump is applied by hand, through review.
on:
  schedule:
    - cron: "15 7 * * 1"      # Mondays, after the nightly image work settles
  workflow_dispatch:

permissions:
  contents: read

# One job per pin family (`report_pin_bump.py <family>`). The requirements family
# (#1641) is deliberately NOT on this schedule: its VERSIONS are Dependabot's to
# bump, and its digests only move when a version does, so a weekly rewrite would
# be a no-op PR every Monday. The operator refreshes it beside the version bump
# -- DEVELOPMENT.md, "Regenerating the pinned dependency hashes".
jobs:
  tinyproxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write            # one issue per family; no push, no PR (#3420)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and report the egress sidecar digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 devtools/report_pin_bump.py tinyproxy

  rustup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write            # one issue per family; no push, no PR (#3420)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and report the rustup pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 devtools/report_pin_bump.py rustup

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write            # one issue per family; no push, no PR (#3420)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and report the Trivy pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 devtools/report_pin_bump.py trivy

  rust-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write            # one issue per family; no push, no PR (#3420)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and report the Rust toolchain pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 devtools/report_pin_bump.py rust-toolchain
