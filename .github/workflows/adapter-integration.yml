name: Adapter integration

# #1422: the adapter tests that invoke a REAL scanner against a REAL fixture
# have never executed in automated CI. They guard themselves on preconditions
# the standard runner cannot meet -- the goat fixtures are baked into the
# fixtures image, and cargo-audit/brakeman/spotbugs/roslyn ship on no runner --
# so `pytest tests/` skips every one of them and reports green. A detection
# regression in any adapter would not fail anything.
#
# This is the environment where they are REQUIRED to run:
# PANOPTICON_REQUIRE_INTEGRATION=1 turns each unmet precondition from a silent
# skip into a hard failure, so the job cannot pass by skipping the work it
# exists to do.
#
# Daily rather than per-PR, per the cost note in #1422: it builds the fixtures
# image (three upstream goat checkouts plus a WebGoat jar build) on top of the
# nightly tools image. Scheduled after docker-publish (06:00) and
# tools-image-health (06:30) so it tests the image those two just produced and
# vouched for. Use workflow_dispatch to run it on demand against a branch.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}-tools:latest
      # ARC-2930403871 (#1771). Production runs the tools image as the `scanner`
      # user -- `Dockerfile:486` (`RUN useradd -m -u 1000 scanner`) and
      # `Dockerfile:506` (`USER scanner`) -- and this job ran the SAME adapters
      # against the SAME tools as uid 0, because `Dockerfile.fixtures` ends on
      # `USER root` for its build and nothing dropped that privilege at run
      # time. So the one gate where the adapters meet real tools and real
      # fixtures proved them at a privilege production never has, and a
      # root-only adapter regression -- the #1877 class, a tool refusing its
      # input under the real uid -- passed the only gate that could catch it.
      # The runtime user is the CALLER's to set: it is set here for every
      # `docker run` of the fixtures image, and asserted inside the container
      # before any probe runs.
      #
      # By NAME, not `1000:1000`: the Dockerfile states the uid and says
      # nothing about the gid, so the name is the only spelling that takes
      # production's own primary group rather than a guessed one. The uid is
      # pinned all the same and travels in as `EXPECTED_UID`, so a uid change
      # in `Dockerfile:486` reddens this job instead of drifting past it.
      SCANNER_USER: scanner
      SCANNER_UID: "1000"
      # The HOME `USER scanner` gives production, pinned rather than left to
      # docker's own passwd lookup under `--user`. Deliberately NOT an empty
      # scratch dir: bundler-audit reads the REFRESHED ruby advisory DB from
      # `$HOME/.local/share/ruby-advisory-db` (`Dockerfile:490-492`), so an
      # empty HOME would silently fall back to the gem's stale vendored copy --
      # a quieter version of the defect this flag exists to remove. It IS
      # writable by uid 1000 (`Dockerfile:487` chowns it, and the build-time
      # gate `skill/scripts/smoke_adapters.py` requires `$HOME` writable), and
      # every adapter's own scratch is an `mkdtemp` under the container's
      # world-writable /tmp, exactly as in production.
      SCANNER_HOME: /home/scanner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately NO fallback to a local build, unlike security.yml. That
      # workflow degrades to a secretless image with a ::warning:: because a
      # partial scan still gates something useful. Here a degraded image would
      # mean the toolchain preconditions fail and the whole run reports red for
      # a reason that is not a regression -- so an unavailable image is a loud
      # infrastructure failure, not a quietly weaker test.
      - name: Pull the nightly tools image
        run: |
          if ! docker pull "$IMAGE"; then
            echo "::error::${IMAGE} is not available from GHCR. This job tests the published nightly image and does not build a substitute; check docker-publish.yml and tools-image-health.yml first."
            exit 1
          fi
          docker tag "$IMAGE" panopticon-tools:latest

      # FROM panopticon-tools:latest, adding the railsgoat / WebGoat / AspGoat
      # fixtures (SHA-pinned in Dockerfile.fixtures) and pytest (hash-pinned in
      # requirements-fixtures.txt).
      - name: Build the fixtures image
        run: docker build -f Dockerfile.fixtures -t panopticon-fixtures:latest .

      # The posture, asserted rather than assumed (ARC-2930403871). `--user` is
      # the intent; `id -u` inside the container is the proof, and it runs
      # BEFORE the probes so a lane that lost the flag -- or an image whose
      # passwd stopped carrying the user -- is a red job rather than a green
      # tick over probes run as root. `tests/test_workflow_pins.py` pins the
      # flag from the file; this is the half a file cannot state.
      - name: Assert the container runs as the scanner user
        run: |
          docker run --rm \
            --user "$SCANNER_USER" \
            -e HOME="$SCANNER_HOME" \
            -e EXPECTED_UID="$SCANNER_UID" \
            --entrypoint sh panopticon-fixtures:latest \
            -c 'if [ "$(id -u)" = "$EXPECTED_UID" ]; then echo "adapter probes run as $(id -un):$(id -gn), uid $(id -u), HOME=$HOME"; else echo "::error::the fixtures image would run the adapter probes as uid $(id -u), not the scanner uid $EXPECTED_UID that every production scan runs as"; exit 1; fi'

      # The whole tests/tools/ tree, not a `*_integration.py` glob: the
      # railsgoat probe that caught the stale brakeman CWE map lives in
      # test_brakeman.py, so narrowing the selector would scope around exactly
      # the class of defect this job exists to catch.
      - name: Run the adapter tests against real tools and fixtures
        run: |
          docker run --rm \
            --user "$SCANNER_USER" \
            -v "$PWD:/work:ro" -w /work \
            -e HOME="$SCANNER_HOME" \
            -e FIXTURE_ROOT=/opt/panopticon-fixtures \
            -e PANOPTICON_REQUIRE_INTEGRATION=1 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint sh panopticon-fixtures:latest \
            -c "python3 -m pytest tests/tools/ -q -rs -p no:cacheprovider"

      # The Gitleaks run_tools regression needs the host Docker daemon because
      # run_tools itself launches containers. Reuse the pulled tools image;
      # the test resolves this tag to an immutable ID before its first scan.
      - name: Set up Python for host Docker regression
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install host test dependencies
        run: |
          python -m pip install --no-deps --require-hashes \
            -r .github/requirements-gate.txt -r requirements-fixtures.txt

      - name: Run Gitleaks production dispatch through host Docker
        run: |
          PANOPTICON_GITLEAKS_HOST_DOCKER=1 \
          PANOPTICON_REQUIRE_INTEGRATION=1 \
          PANOPTICON_GITLEAKS_TEST_IMAGE=panopticon-tools:latest \
          python3 -m pytest tests/tools/test_legacy_sarif_integration.py::TestGitleaksRunToolsDocker -q -rs -p no:cacheprovider

  # #1655, owner ruling 2026-09-22: the hostile-build containment probe gets a
  # scheduled lane, and BOTH of its controls are set here together.
  #
  # `tests/tools/test_hostile_csproj.py` is the only test that invokes an
  # adapter on a hostile project: it executes evil.csproj's MSBuild target,
  # which attempts a live `curl` and writes a marker file. Two things make
  # that safe, and neither is sufficient alone.
  #   PANOPTICON_CONTAINMENT_PROBE=1 is the opt-in -- without it the probe
  #     skips, which is correct on a dev box and on the standard runner.
  #   --network none is what makes the opt-in TRUE. The probe does not trust
  #     the flag (#1183): before running the hostile build it dials out, and
  #     if anything answers it REFUSES and fails (`_UNCONTAINED_MSG`). So a
  #     lane that set only the env var would not quietly perform the curl --
  #     it would go red -- but it would also never run the probe.
  #
  # Its own job, not a step in `integration` and not `needs:` it: an adapter
  # regression that reddens the integration job must not also hide whether
  # containment still holds, and vice versa. Same image, same schedule, two
  # independent answers. The trigger surface is unchanged -- scheduled and
  # manual only -- because this job executes attacker-shaped build logic and
  # a PR-triggered lane would execute it on whatever a PR proposed.
  containment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}-tools:latest
      # The same runtime user as the `integration` job, whose `env:` block
      # carries the reasoning (ARC-2930403871, #1771), and here for one more:
      # this is the lane that runs an adapter on a HOSTILE project, so the
      # privilege the hostile build executes with is part of the answer the job
      # reports. Repeated per job rather than hoisted to the workflow: a job
      # that runs the fixtures image without stating its runtime user is the
      # defect, and that has to be visible where the job is read.
      SCANNER_USER: scanner
      SCANNER_UID: "1000"
      # The HOME `USER scanner` gives production, pinned rather than left to
      # docker's own passwd lookup under `--user`. Deliberately NOT an empty
      # scratch dir: bundler-audit reads the REFRESHED ruby advisory DB from
      # `$HOME/.local/share/ruby-advisory-db` (`Dockerfile:490-492`), so an
      # empty HOME would silently fall back to the gem's stale vendored copy --
      # a quieter version of the defect this flag exists to remove. It IS
      # writable by uid 1000 (`Dockerfile:487` chowns it, and the build-time
      # gate `skill/scripts/smoke_adapters.py` requires `$HOME` writable), and
      # every adapter's own scratch is an `mkdtemp` under the container's
      # world-writable /tmp, exactly as in production.
      SCANNER_HOME: /home/scanner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same loud failure as the integration job: a degraded local build would
      # be missing the .NET SDK the probe needs, so the guard would report the
      # toolchain absent rather than the containment answer this job exists
      # for.
      - name: Pull the nightly tools image
        run: |
          if ! docker pull "$IMAGE"; then
            echo "::error::${IMAGE} is not available from GHCR. This job tests the published nightly image and does not build a substitute; check docker-publish.yml and tools-image-health.yml first."
            exit 1
          fi
          docker tag "$IMAGE" panopticon-tools:latest

      # The hostile-csproj fixture is baked into THIS image and restored there
      # (#1655): roslyn-secguard refuses a C# target with no restore output,
      # and this job scans a read-only mount with no network. pytest arrives
      # with the same layer.
      #
      # Built again rather than shared with `integration`: that independence is
      # the point of the separate job -- a fixtures build that fails for one
      # (a goat clone, a maven compile) must not decide the other's answer --
      # and the cost is one extra fixtures build a day.
      - name: Build the fixtures image
        run: docker build -f Dockerfile.fixtures -t panopticon-fixtures:latest .

      # The posture, asserted rather than assumed (ARC-2930403871). `--user` is
      # the intent; `id -u` inside the container is the proof, and it runs
      # BEFORE the probes so a lane that lost the flag -- or an image whose
      # passwd stopped carrying the user -- is a red job rather than a green
      # tick over probes run as root. `tests/test_workflow_pins.py` pins the
      # flag from the file; this is the half a file cannot state.
      - name: Assert the container runs as the scanner user
        run: |
          docker run --rm \
            --user "$SCANNER_USER" \
            -e HOME="$SCANNER_HOME" \
            -e EXPECTED_UID="$SCANNER_UID" \
            --entrypoint sh panopticon-fixtures:latest \
            -c 'if [ "$(id -u)" = "$EXPECTED_UID" ]; then echo "adapter probes run as $(id -un):$(id -gn), uid $(id -u), HOME=$HOME"; else echo "::error::the fixtures image would run the adapter probes as uid $(id -u), not the scanner uid $EXPECTED_UID that every production scan runs as"; exit 1; fi'

      # Byte-for-byte the integration job's run line, plus `--network none`
      # and the opt-in, and narrowed to the one file that executes the hostile
      # build. Narrow ON PURPOSE here, unlike `integration`: this is the lane
      # that runs attacker-shaped code, and it runs only the test written to
      # be run that way.
      - name: Run the hostile-build containment probe offline
        run: |
          docker run --rm \
            --network none \
            --user "$SCANNER_USER" \
            -v "$PWD:/work:ro" -w /work \
            -e HOME="$SCANNER_HOME" \
            -e FIXTURE_ROOT=/opt/panopticon-fixtures \
            -e PANOPTICON_REQUIRE_INTEGRATION=1 \
            -e PANOPTICON_CONTAINMENT_PROBE=1 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint sh panopticon-fixtures:latest \
            -c "python3 -m pytest tests/tools/test_hostile_csproj.py -q -rs -p no:cacheprovider"
