name: panopticon-tools image health

# Two safety nets for the nightly docker-publish schedule (#1032), both driven
# by the frequent push-to-main activity this repo already has -- so this
# workflow is itself never caught by GitHub's 60-day-inactivity auto-disable.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    # Re-enable the nightly docker-publish schedule if a >60-day dormant stretch
    # disabled it. Idempotent -- a no-op when already enabled. An API call, never
    # a commit, so there is no keep-alive commit noise on main.
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable the docker-publish schedule
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow enable docker-publish.yml --repo "$REPO"

  freshness:
    # Fail loudly when the published panopticon-tools:latest image is stale --
    # the case the keep-alive can't catch, where the schedule is enabled but the
    # nightly build has been silently failing (the #1026 stale-semgrep class).
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      MAX_AGE_DAYS: "3"   # nightly build; >3 days old means ~3 missed rebuilds
    steps:
      - name: Assert panopticon-tools:latest is fresh
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          api="/orgs/${OWNER}/packages/container/panopticon-tools/versions?per_page=100"
          if ! resp=$(gh api "${api}" 2>err.txt); then
            echo "::warning::Could not query the panopticon-tools package ($(cat err.txt)); skipping the freshness check this run."
            exit 0
          fi
          updated=$(printf '%s' "${resp}" | jq -r \
            '[.[] | select(.metadata.container.tags[]? == "latest")]
             | sort_by(.updated_at) | last | .updated_at // empty')
          if [ -z "${updated}" ]; then
            echo "::error::No :latest-tagged panopticon-tools image exists -- the nightly docker-publish build has never succeeded."
            exit 1
          fi
          now=$(date -u +%s)
          built=$(date -u -d "${updated}" +%s)
          age_days=$(( (now - built) / 86400 ))
          echo "panopticon-tools:latest last published ${updated} (${age_days}d ago)"
          if [ "${age_days}" -gt "${MAX_AGE_DAYS}" ]; then
            echo "::error::panopticon-tools:latest is ${age_days}d old (> ${MAX_AGE_DAYS}d): the nightly docker-publish build is failing or its schedule is disabled. Check the 'Publish panopticon-tools image' workflow."
            exit 1
          fi
