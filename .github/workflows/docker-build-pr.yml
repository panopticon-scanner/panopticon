name: Dockerfile PR build

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.fixtures
      # The pinned dependency digests and lockfiles: changing them changes
      # what a build installs, so the build has to run (#1641, #1734). The
      # tools image's are the ones that decide whether `--require-hashes` and
      # `npm ci` still succeed, and a stale digest fails the build rather than
      # installing something else -- which is only useful if the build runs.
      - requirements-fixtures.txt
      - requirements-tools.txt
      - tools-image/**
      - .github/workflows/docker-publish.yml
      - .github/workflows/docker-build-pr.yml
      - skill/scripts/**

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        env:
          # #1529: this binary is fetched and then EXECUTED, so what arrives has
          # to be verified -- the Dockerfile's ten artifact fetches are all
          # `sha256sum -c`'d and this step was the last one that was not.
          #
          # The digest was read from upstream's own hadolint-Linux-x86_64.sha256
          # AND recomputed from the downloaded artifact, which is the rule
          # scripts/bump_pins.py states for every pin it maintains: never guess
          # a checksum. bump_pins has no hadolint family and does not cover this
          # file; bumping the version here means re-reading both.
          HADOLINT_VERSION: "2.12.0"
          HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
        run: |
          # #run10 OPS-A1A: bound + fail-fast this fetch. It was the last
          # unbounded external download in the repo -- every curl in the
          # Dockerfile and nvd-cache.yml already carries
          # --connect-timeout/--max-time, so a hung GitHub release endpoint
          # stalled this gate to the 360-minute job ceiling instead of failing
          # in a minute. `-f` also makes an HTTP error a failure rather than
          # writing an error page to /tmp/hadolint and exec'ing it.
          curl -sfL --connect-timeout 5 --max-time 60 --retry 3 \
            -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          # Before chmod, not after: the point is that nothing unverified is
          # ever made runnable. Runners default to `bash -e -o pipefail`, so a
          # mismatch fails the job here.
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          sudo mv /tmp/hadolint /usr/local/bin/hadolint
          hadolint Dockerfile

      # #1421: this workflow fires on `skill/scripts/**`, so most PRs pay for it,
      # and a plain `docker build` has no layer cache -- every one of them was a
      # cold full build that compiles cargo-audit from source and runs near the
      # job timeout.
      #
      # The cache it reads is the one `docker-publish.yml` already writes on main
      # (`type=gha,scope=linux-amd64`); a PR build can read its base branch's
      # caches, so the nightly image build warms every PR for free. `ubuntu-latest`
      # is amd64, which is why that scope and not the arm64 one.
      #
      # Deliberately cache-from ONLY. A `mode=max` export of THIS image would be
      # several GB against a 10GB repo-wide quota, so writing one per PR would
      # evict the very main-branch caches these builds depend on -- it would buy
      # a warm second push to one PR by making every nightly build cold.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          # Dockerfile.fixtures is `FROM panopticon-tools:latest`, so the tools
          # image has to land in the daemon, not just in the build cache.
          load: true
          tags: panopticon-tools:latest
          cache-from: type=gha,scope=linux-amd64

      - name: Lint Dockerfile.fixtures
        run: hadolint Dockerfile.fixtures

      - name: Build Dockerfile.fixtures
        run: docker build -f Dockerfile.fixtures .
