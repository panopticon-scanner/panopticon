version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  # #1641: the security gate's hash-pinned requirements file lives beside the
  # workflow that installs it, and the entry above only reaches the repo root.
  # Without this one the most privileged build in the fleet would be the one
  # dependency set nothing proposes a bump for. The digests still have to be
  # regenerated by hand on any bump -- see DEVELOPMENT.md, "Regenerating the
  # pinned dependency hashes" -- and `--require-hashes` fails the build loudly
  # until they are.
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "daily"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      docker:
        patterns:
          - "docker/*"
      actions:
        patterns:
          - "actions/*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
