version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    cooldown:
      default-days: 7
    groups:
      python-version-updates:
        applies-to: version-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "opentelemetry-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "peewee"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "click"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "jsonschema"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Semgrep 1.177.0 pins these dependency families to the current major
      # or minor line through its transitive requirements.
      - dependency-name: "boltons"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "exceptiongroup"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "pyjwt"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "wcmatch"
        update-types:
          - "version-update:semver-major"
      # OpenTelemetry's API, proto, and instrumentation packages constrain
      # these dependencies until their pinned parents move together.
      - dependency-name: "importlib-metadata"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "protobuf"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "wrapt"
        update-types:
          - "version-update:semver-major"
      # Pydantic 2.13.5 requires the exact pydantic-core 2.46.5 release.
      - dependency-name: "pydantic-core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  # #1641: the security gate's hash-pinned requirements file lives beside the
  # workflow that installs it, and the entry above only reaches the repo root.
  # Without this one the most privileged build in the fleet would be the one
  # dependency set nothing proposes a bump for. The digests still have to be
  # regenerated by hand on any bump -- see DEVELOPMENT.md, "Regenerating the
  # pinned dependency hashes" -- and `--require-hashes` fails the build loudly
  # until they are.
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "daily"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      docker:
        patterns:
          - "docker/*"
      actions:
        patterns:
          - "actions/*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
