# panopticon groups catalog (matrix form) -- match/tests/panels/exclude.
# gitignore-flavored globs; first matching group wins; edit and commit.
# A group whose keys are names (no match:) is a parent; its subgroups
# are its layers and roll up to it in the report.
#
# 2026-09-06: re-proposed from scratch by the 5.2 grouping engine
# (`driver setup .`, setup-scan on Opus; spine 72 code / 31 commons /
# 126 test-tree files, cap 48). Four verticals replaced the 12 hand-crafted
# 5.1 groups (parked as groups.yml.5.1). Hand edits on top of the draft:
#   - `AI` renamed `Orchestration` (catalog name fit literally, read badly
#     in reports); OPS added to its floor -- 5.1 `Platform` (_version,
#     write_guard_hook) carried OPS and those files now live here.
#   - ToolAdapters (63 files > cap) given an `Integration` layer over the
#     adapter modules instead of mechanical chunking; residual is `Core`.
#   - `CI` committed over all of .github/** -- the shipped Commons CI
#     category misses top-level `.github/*.yml` / `.github/*.sh`, and a
#     committed group named CI suppresses that category, so it takes the
#     whole tree. Its four tests exercise .github files. Retire this
#     group once #1508 lands in the shipped catalog.
#   - `exclude_paths` re-added by hand: setup drafts drop it (#1504).
#   - 2026-09-15 (#1638 P06, run-13): the matrix had stopped growing with the
#     tree -- 23 runtime files (the host boundary, the `runners/` and `probes/`
#     packages, orchestrate/progress/findings_contract, skill/workflows) and 49
#     test files were reviewed in `Ungrouped_1`, without their architecture
#     context and, worse, without a test inventory: `phases/review.py` builds
#     that inventory from the claiming group's `tests:` axis, so a reviewer was
#     told the Codex scope broker had no automated coverage (P13). Fourth
#     `Orchestration` layer `Hosts` added over the host boundary, and every
#     stray test file given the group whose code it exercises.
#     `tests/test_matrix_coverage.py` now fails the suite when a file is left
#     unclaimed -- which is how eighteen of them accumulated unnoticed.
#     THIS FILE IS TRACKED (force-added past `.gitignore`'s `.panopticon*/`,
#     which exists for run ARTIFACTS): the guard, `driver readiness` and every
#     contributor's PR diff all need the matrix in the checkout, and
#     skill/docs/PANOPTICON.md tells every target repo to commit it.
#
# Fixtures: deliberately-vulnerable hostile test corpora. Redteam mode keeps
# fixtures in review scope by design (discovery.py include_fixtures=redteam),
# but for THIS self-scan they are pure noise -- they are SUPPOSED to be
# vulnerable. `exclude_paths:` (top-level, #1136) prunes them BEFORE grouping,
# so no review cell of any domain sees them -- SEC included, which a per-group
# `exclude:` can never silence (#1084).
exclude_paths:
- tests/fixtures/**
groups:
  ToolAdapters:
    Integration:
      match:
      - skill/scripts/tools/**
      tests:
      - tests/tools/**
      - tests/test_integration_strictness.py
      - tests/test_no_unguarded_parse_index.py
      panels:
      - ARC
      - SEC
    Core:
      match:
      - skill/scripts/run_tools.py
      - skill/scripts/ingest_tools.py
      - skill/scripts/_run_adapter.py
      - skill/scripts/smoke_adapters.py
      - skill/scripts/run_fixture_tests.py
      - skill/scripts/capture_goldens.py
      - skill/scripts/security_gate.py
      - scripts/bump_pins.py
      tests:
      - tests/run_tools_test_helpers.py
      - tests/test_run_tools_core.py
      - tests/test_run_tools_adapter.py
      - tests/test_run_tools_containment.py
      - tests/test_run_tools_dispatch.py
      - tests/test_run_tools_docker.py
      - tests/test_run_tools_languages.py
      - tests/test_ingest_tools.py
      - tests/test_run_adapter.py
      - tests/test_smoke_adapters.py
      - tests/test_run_fixture_tests.py
      - tests/test_run_tools_progress.py
      - tests/test_capture_goldens.py
      - tests/test_no_live_docker.py
      - tests/test_phase1_integration.py
      - tests/test_schemas.py
      - tests/test_security_gate.py
      - tests/test_dockerfile.py
      - tests/test_bump_pins.py
      panels:
      - ARC
      - SEC
  Orchestration:
    Phases:
      match:
      - skill/scripts/driver.py
      - skill/scripts/phases/**
      - skill/scripts/orchestrate.py
      - skill/scripts/progress.py
      # Deliberately NOT with its four sibling contracts (findings-envelope,
      # advisor-verdict, report, x0x-report) in Reporting:Core: that leaf is at
      # 48/48, and a 49th file would chunk it into `Reporting:Core_1`, a name
      # the matrix has no entry for -- the cell would then be reviewed with an
      # empty test inventory, which is the P13 defect this PR exists to close.
      # phases/persist.py is this schema's only writer and validator, so Phases
      # is a true home rather than a parking space. Returns to its siblings
      # when the Reporting split (follow-up to #1638 P06) lands.
      - skill/reference/verdict-bundle-schema.json
      tests:
      - tests/test_driver.py
      - tests/test_driver_verify.py
      - tests/test_driver_tool_verify.py
      - tests/phases/**
      - tests/test_orchestrate.py
      - tests/test_orchestrate_session.py
      # #1638 P16: the AST tripwire over every agent-written-verdict read path.
      # Two of its three subjects are phases/ modules (verify._cell_verdicts,
      # persist._verify_accepts); the third, scripts/evidence.py, sits in
      # Reporting:Core, which is full at 48/48 -- and a parking space there
      # would chunk that leaf. This is the true home, not the spare one.
      - tests/test_agent_verdict_guard.py
      - tests/test_assets.py
      - tests/test_e2e.py
      - tests/test_tree_baseline.py
      panels:
      - ARC
      - SEC
      - OPS
    Core:
      match:
      - skill/scripts/dispatch.py
      # #1648: the exact-money vocabulary the ledger and the `--max-budget-usd`
      # gate read (`scripts.ledger.Ledger` is the only caller). It belongs
      # beside orchestrate.py in `Phases`, which is FULL at 48/48 -- a 49th
      # file chunks that leaf into `Orchestration:Phases_1`, a name the
      # matrix has no entry for, and the cell is then reviewed with an empty
      # test inventory (the #1638 P13 defect). Same reasoning as the two
      # parking notes in `Phases` above, pointing the other way; it moves
      # back when the Phases split lands.
      - skill/scripts/money.py
      # item 21b: `class Ledger` moved out of orchestrate.py (a pure move,
      # #1648's ledger reader/writer) so the entry script stays under its
      # 700-line instruction. Same parking reasoning as money.py just above
      # -- belongs beside orchestrate.py in `Phases`, full at 48/48.
      - skill/scripts/ledger.py
      - skill/scripts/group_runner.py
      - skill/scripts/model_resolver.py
      - skill/scripts/run_manifest.py
      - skill/scripts/write_guard_hook.py
      - skill/scripts/collect_usage.py
      - skill/scripts/_version.py
      - skill/agents/**
      - skill/reference/model-profiles.yml
      tests:
      - tests/test_dispatch.py
      - tests/test_dispatch_request.py
      - tests/test_money.py
      - tests/test_ledger.py
      - tests/test_group_runner.py
      - tests/test_group_runner_integration.py
      - tests/test_model_resolver.py
      - tests/test_run_manifest.py
      - tests/test_agent_templates.py
      - tests/test_domain_advisor_template.py
      - tests/test_write_guard_hook.py
      - tests/test_collect_usage.py
      - tests/test_tool_aware_review.py
      - tests/test_version.py
      - tests/test_skill_md.py
      panels:
      - ARC
      - SEC
      - OPS
    # The host boundary: the registry every posture decision reads, the probes
    # that prove a capability, the per-family runners the loop drives, and the
    # two PreToolUse guards a dispatched agent runs under. Its own layer because
    # it is where the repo takes untrusted input from another vendor's CLI --
    # run-13 reviewed all of it as `Ungrouped_1` (#1638 P06). Test paths are
    # LITERAL on purpose: a wildcard `tests:` glob is scoped to the group's
    # match: prefixes or its name (tests_axis.scope_ok), and `tests/runners/**`
    # carries neither "Orchestration" nor "Hosts", so it would credit nothing.
    Hosts:
      match:
      - skill/scripts/hosts.py
      - skill/scripts/host_probes.py
      - skill/scripts/host_disclosure.py
      - skill/scripts/codex_host.py
      - skill/scripts/codex_read_tools.py
      - skill/scripts/kimi_toml.py
      - skill/scripts/kimi_guard_hook.py
      - skill/scripts/read_guard_hook.py
      - skill/scripts/runners/**
      - skill/scripts/probes/**
      - skill/workflows/**
      tests:
      - tests/runners/__init__.py
      - tests/runners/conftest.py
      - tests/runners/test_base.py
      - tests/runners/test_claude.py
      - tests/runners/test_codex.py
      - tests/runners/test_kimi.py
      - tests/runners/test_session.py
      - tests/probes/__init__.py
      - tests/probes/helpers.py
      - tests/probes/test_claude.py
      - tests/probes/test_codex.py
      - tests/probes/test_common.py
      - tests/probes/test_kimi.py
      - tests/test_hosts.py
      - tests/test_host_probes.py
      - tests/test_host_disclosure.py
      - tests/test_host_launch_guard.py
      - tests/test_host_posture_wiring.py
      - tests/test_host_evidence_wiring.py
      - tests/test_codex_host.py
      - tests/test_codex_read_tools.py
      - tests/test_kimi_guard_hook.py
      - tests/test_read_guard_hook.py
      - tests/test_hook_command_quoting.py
      - tests/test_generic_retirement_bar.py
      - tests/test_family_guardrails_doc.py
      panels:
