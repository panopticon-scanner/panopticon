[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panopticon"
version = "5.0.1"
description = "Portable, standards-cited code-review skill for AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # The driver and synthesize load YAML (groups.yml, model-profiles.yml,
    # capability_*.yml); previously undeclared (#5.0-01).
    "pyyaml>=6.0.3",
    # #run7 ARC-F2E declared jsonschema a runtime dep to stop schema validators
    # failing open in a bare `pip install panopticon`. #run10: that rationale no
    # longer describes the tree. Its named consumer codex_runner.validate_schema
    # was deleted with the 4.x plumbing (#1441), and discovery/model_resolver/
    # score_gate never imported jsonschema -- today NO runtime module does, and
    # driver._scout_shape_errors deliberately hand-rolls a dependency-free
    # subset instead. Kept declared (removing it is a packaging decision, not a
    # residue cleanup) but it is currently exercised only by the test suite,
    # which declares it separately in the test extra and dependency-group.
    "jsonschema>=4.26.0",
]
authors = [
    {name = "The Panopticon Authors"},
]
keywords = ["code-review", "security", "static-analysis", "ai-agent", "skill"]

[project.optional-dependencies]
test = ["pytest>=9.1.1", "pytest-xdist>=3.8.0", "jsonschema>=4.0"]
dev = ["panopticon[test]", "ruff>=0.16.5"]

[dependency-groups]
test = ["pytest>=9.1.1", "pytest-xdist>=3.8.0", "jsonschema>=4.0"]
dev = [{include-group = "test"}, "ruff>=0.16.5"]

[project.urls]
Homepage = "https://github.com/panopticon-scanner/panopticon"
Repository = "https://github.com/panopticon-scanner/panopticon"
Issues = "https://github.com/panopticon-scanner/panopticon/issues"

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.json"]
force-exclude = true
[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E401", "E501", "E701", "E702"]

[tool.bandit]
exclude_dirs = ["tests", "tests/*"]
skips = ["B101", "B404", "B110", "B112"]
