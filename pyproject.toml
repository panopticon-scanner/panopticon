[project]
name = "panopticon"
version = "5.0.1"
description = "Portable, standards-cited code-review skill for AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # The driver and synthesize load YAML (groups.yml, model-profiles.yml,
    # capability_*.yml); previously undeclared (#5.0-01).
    "pyyaml>=6.0.3",
]
authors = [
    {name = "The Panopticon Authors"},
]
keywords = ["code-review", "security", "static-analysis", "ai-agent", "skill"]

[project.urls]
Homepage = "https://github.com/psyberone/panopticon"
Repository = "https://github.com/psyberone/panopticon"
Issues = "https://github.com/psyberone/panopticon/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E401", "E501", "E701", "E702"]

[tool.ruff.lint.pydocstyle]
convention = "google"
