[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panopticon"
version = "5.1.0"
description = "Portable, standards-cited code-review skill for AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # The driver and synthesize load YAML (groups.yml, model-profiles.yml,
    # capability_*.yml); previously undeclared (#5.0-01).
    "pyyaml>=6.0.3",
    # capture_goldens structurally trims untrusted scanner XML. Reject DTDs
    # and entities rather than expanding target-controlled input.
    "defusedxml>=0.7.1",
    # #run7 ARC-F2E declared jsonschema a runtime dep to stop schema validators
    # failing open in a bare `pip install panopticon`. #run10 recorded that no
    # runtime module imported it any more (codex_runner.validate_schema went
    # with the 4.x plumbing, #1441) and kept the declaration anyway. #1639 P15
    # gave it a runtime consumer again, and the original rationale back with
    # it: `synth/validate_schema.py` validates the report, the hydrated split
    # parts and the X0X artifact against their published schemas in the normal
    # completion path, and FAILS CLOSED when the import does not resolve -- so
    # a bare install without this dependency does not silently stop validating,
    # it says so and exits non-zero. driver._scout_shape_errors still hand-rolls
    # a dependency-free subset on purpose, for an agent artifact read at a point
    # where a missing package must not stop a run.
    "jsonschema>=4.26.0",
]
authors = [
    {name = "The Panopticon Authors"},
]
keywords = ["code-review", "security", "static-analysis", "ai-agent", "skill"]

[project.optional-dependencies]
test = ["pytest>=9.1.1", "pytest-xdist>=3.8.0", "pytest-cov>=7.1.0", "jsonschema>=4.0"]
dev = ["panopticon[test]", "ruff>=0.16.9", "mypy>=2.3.1"]

[dependency-groups]
test = ["pytest>=9.1.1", "pytest-xdist>=3.8.0", "pytest-cov>=7.1.0", "jsonschema>=4.0"]
dev = [{include-group = "test"}, "ruff>=0.16.9", "mypy>=2.3.1"]

[project.urls]
Homepage = "https://github.com/panopticon-scanner/panopticon"
Repository = "https://github.com/panopticon-scanner/panopticon"
Issues = "https://github.com/panopticon-scanner/panopticon/issues"

[tool.setuptools]
# The packaging intent, declared rather than left to auto-discovery (#2239):
# this project ships NO importable modules. The skill directory and the tools
# image are the delivery vehicles -- README tells an operator to install the
# three runtime dependencies directly and the code runs from the checkout, every
# CI install OF THIS PROJECT is `pip install -e ".[dev]"`/`".[test]"` for the
# dev tooling, and nothing anywhere builds a wheel. So an empty `py-modules` is
# the truthful answer, and a build that ever needs to ship code has to say so
# here on purpose.
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["skill", "skill/scripts", "scripts", "."]
addopts = ["--import-mode=importlib"]
markers = [
    # #1515: the ONLY tests allowed to reach the Docker daemon. Everything else
    # gets run_tools.docker_available() -> False from the autouse fixture in
    # tests/conftest.py, so the unit suite runs the same branch on a workstation
    # as it does on a bare CI runner.
    "docker: test genuinely needs the Docker daemon (excluded from the unit suite's refusal)",
    # #1616 item 8: the ONLY tests allowed to reach
    # `scripts.runners.claude.Runner.run_entry`. Everything else gets a
    # LaunchRefused from the autouse fixture in tests/conftest.py, so a test
    # that builds the default host's runner by accident says so loudly instead
    # of collecting one more failed entry.
    "claude_runner: test drives the claude family's own run_entry (with an injected runner=<fake>)",
]

[tool.mypy]
files = ["skill/scripts", "scripts"]
python_version = "3.11"
# Runtime imports use `scripts.*` from skill/, even when entry scripts are
# invoked by path. Check that same namespace instead of skill.scripts.*.
mypy_path = "$MYPY_CONFIG_FILE_DIR/skill"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
# Two classes of unresolvable import, measured with the flag OFF, and neither is
# a type error this repo can fix here: the flat imports of our OWN modules
# (`import discovery` beside `import scripts.discovery` -- the second of the two
# import modes DEVELOPMENT.md describes, whose retirement #1516 tracks), and
# third-party packages that ship no stubs (defusedxml, jsonschema, bandit).
# Nothing else appears, so the flag suppresses no finding of ours.
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.json"]
force-exclude = true

[tool.coverage.run]
core = "sysmon"
source = ["skill/scripts", "scripts"]
omit = ["*/tests/fixtures/*", "*/tests/goldens/*"]
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E401", "E501", "E701", "E702"]

[tool.bandit]
exclude_dirs = ["tests", "tests/*"]
skips = ["B101", "B404", "B110", "B112"]
